# Collector for the metrics-tracing-otlp scenario. It only needs to accept what CAS exports.
# The debug exporter logs through the collector's own logger, so it stays silent while that
# logger is at WARN; switch the level to INFO to see every batch CAS sends.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: WARN
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [ otlp ]
      exporters: [ debug ]
    metrics:
      receivers: [ otlp ]
      exporters: [ debug ]
    logs:
      receivers: [ otlp ]
      exporters: [ debug ]
