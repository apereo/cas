# Memory limits are per Redis server; see README.md for large ticket datasets.
x-redis-server: &redis-server
  volumes:
    - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  redis-master:
    <<: *redis-server
    image: redis:8.10.3
    container_name: redis_server_master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "${REDIS_MAXMEMORY:-0}"]
    ports:
      - "6379:6379"
      
  redis-sentinel-image:
    build: ./redis-sentinel
    image: local/redis-sentinel:8.4.0

  redis-ssl:
    <<: *redis-server
    image: redis:8.10.3
    container_name: redis_server_ssl
    command: >
      redis-server /usr/local/etc/redis/redis.conf
        --maxmemory ${REDIS_MAXMEMORY:-0}
        --port 0
        --tls-port          6669
        --tls-cert-file     /etc/ssl/certs/redis.crt
        --tls-key-file      /etc/ssl/certs/redis.key
        --tls-ca-cert-file  /etc/ssl/certs/redis.crt
        --requirepass       pAssw0rd123
    ports:
      - "16669:6669"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./certs:/etc/ssl/certs

  redis-master2:
    <<: *redis-server
    image: redis:8.10.3
    container_name: redis_server_master2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "${REDIS_MAXMEMORY:-0}"]
    # These envs were also Bitnami-specific; kept or removed won't affect tests.
    environment:
      - REDIS_PASSWORD=pAssw0rd123
    ports:
      - "16389:6379"

  sentinel_1:
    image: local/redis-sentinel:8.4.0
    container_name: redis_sentinel_1
    depends_on:
      - redis-master
      - redis-sentinel-image
    ports:
      - "26379:26379"
    environment:
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_MASTER_HOST=localhost
      - REDIS_PASSWORD=password123         # (optional) master password, like before
      - REDIS_SENTINEL_PASSWORD=password456 # sentinel password (CAS uses this)

  sentinel_2:
    image: local/redis-sentinel:8.4.0
    container_name: redis_sentinel_2
    depends_on:
      - redis-master
      - redis-sentinel-image
    ports:
      - "26380:26379"
    environment:
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_MASTER_HOST=localhost
      - REDIS_PASSWORD=password123
      - REDIS_SENTINEL_PASSWORD=password456

  sentinel_3:
    image: local/redis-sentinel:8.4.0
    container_name: redis_sentinel_3
    depends_on:
      - redis-master
      - redis-sentinel-image
    ports:
      - "26381:26379"
    environment:
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_MASTER_HOST=localhost
      - REDIS_PASSWORD=password123
      - REDIS_SENTINEL_PASSWORD=password456
