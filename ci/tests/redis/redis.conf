# Disposable test data: avoid snapshot forks and AOF writes during bulk loads.
save ""
appendonly no

# An exhausted memory budget must fail writes, never evict live tickets.
maxmemory-policy noeviction

# Large ticket indexes and expired datasets should not block the event loop
# while their allocations are freed. Keys disappear immediately in either case.
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes
replica-lazy-flush yes

# Spend more CPU reclaiming expired tickets to reduce retained expired data.
active-expire-effort 5
