# walt.id 1.2.1 and later refuse outbound wallet fetches to private addresses unless allowed here. The wallet reaches
# CAS through host.docker.internal, which resolves to the private host-gateway address, so private networks are
# allowed; loopback, link-local and cloud-metadata addresses stay refused.
allowLoopback = false
allowPrivateNetworks = true
trustedHostSuffixes = []
