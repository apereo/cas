name: Unit & Integration Tests

env:
  JAVA_OPTS: "-Xms512m -Xmx8048m -Xss512m -XX:ReservedCodeCacheSize=512m -server"
  TERM: xterm-256color
  GH_PACKAGE_REGISTRY_USER: ${{ secrets.GH_PACKAGE_REGISTRY_USER }}
  GH_PACKAGE_REGISTRY_TOKEN: ${{ secrets.GH_PACKAGE_REGISTRY_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
  SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  COSMOS_DB_URL: ${{ secrets.COSMOS_DB_URL }}
  COSMOS_DB_KEY: ${{ secrets.COSMOS_DB_KEY }}
  AZURE_MAPS_API_KEY: ${{ secrets.AZURE_MAPS_API_KEY }}
  AZURE_MAPS_CLIENT_ID: ${{ secrets.AZURE_MAPS_CLIENT_ID }}
  AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
  AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
  AZURE_AD_CLIENT_SECRET_MAIL: ${{ secrets.AZURE_AD_CLIENT_SECRET_MAIL }}
  AZURE_AD_USER_PASSWORD: ${{ secrets.AZURE_AD_USER_PASSWORD }}
  AZURE_AD_TENANT: ${{ secrets.AZURE_AD_TENANT }}
  AZURE_AD_DOMAIN: ${{ secrets.AZURE_AD_DOMAIN }}
  PERMIT_IO_API_KEY: ${{ secrets.PERMIT_IO_API_KEY }}
  JDK_CURRENT: 25
  JDK_DISTRIBUTION: "corretto"
  RETRY_ATTEMPTS: 2
  RETRY_MINUTES: 45
  CATEGORY_REGEX: ".*"
##########################################################################

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 10 * * *'  # This needs to match the condition below that disables PTS mode.
  push:
    branches:
      - master
      - next
      - '!**.**.**'
      - '!heroku-*'
      - '!pr-*'
  pull_request:
    types: [ labeled ]
    branches: [ master, pr-* ]

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: true

##########################################################################

jobs:
  trigger-ci:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'CI')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CI
        run: echo "CI Triggered"
  ##########################################################################
  initialize:
    needs: [ trigger-ci ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Initialize
        run: ls ./ci && find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh

  ##########################################################################

  testcategories:
    needs: [ initialize ]
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.get-categories.outputs.categories }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - id: get-categories
        shell: bash
        run: |
          categories=$(./gradlew --build-cache --configure-on-demand -q testCategories)
          echo "$categories" | jq .
          echo "categories=$categories" >> "$GITHUB_OUTPUT"
  ##########################################################################
  
  tests:
    needs: [ testcategories ]
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        category: ${{fromJSON(needs.testcategories.outputs.categories)}}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.category }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Initialize
        run: find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh
        shell: bash
      - name: Run Tests
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ env.RETRY_ATTEMPTS }}
          retry_on: error
          retry_wait_seconds: 5
          timeout_minutes: ${{ env.RETRY_MINUTES }}
          shell: bash
          command: |
            chmod +x ./testcas.sh
            coverage=""
            if [[ "${{ github.event_name }}" != "pull_request" ]]; then
              coverage="--with-coverage"
            fi
            if [[ "${{ github.event_name }}" == "schedule" ]] && [[ "${{ github.event.schedule }}" == "0 10 * * *" ]]; then
              echo "Running tests without PTS mode"
              ./testcas.sh --no-watch --category ${{ matrix.category }} --events FAILED --no-pts $coverage
            else 
              if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
                ptsMode="REMAINING_TESTS";
              else
                ptsMode="RELEVANT_TESTS";
              fi
              echo "Running tests with PTS mode: $ptsMode"
              ./testcas.sh --no-watch --category ${{ matrix.category }} --events FAILED --pts $ptsMode $coverage
            fi
      - name: Collect Coverage Data
        if: github.event_name != 'pull_request'
        run: |
          find . -path ./.gradle -prune -o -path '*/build/jacoco/*.exec' -print > coverage-data.txt
          if [[ -s coverage-data.txt ]]; then
            tar -czf "jacoco-${{ matrix.category }}.tar.gz" -T coverage-data.txt
            echo "Collected $(wc -l < coverage-data.txt) coverage data files"
          else
            echo "No coverage data files found"
          fi
      - name: Upload Coverage Data
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: "cas-tests-${{ matrix.category }}.jacoco"
          path: "jacoco-${{ matrix.category }}.tar.gz"
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
  ##########################################################################

  coverage:
    runs-on: ubuntu-latest
    needs: [ tests ]
    if: ${{ !cancelled() && needs.tests.result != 'skipped' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Initialize
        run: find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh
        shell: bash
      - name: Download Coverage Data
        uses: actions/download-artifact@v8
        with:
          pattern: "cas-tests-*.jacoco"
          path: coverage-data
          merge-multiple: true
      - name: Build Coverage Report
        run: |
          shopt -s nullglob
          archives=(coverage-data/jacoco-*.tar.gz)
          echo "Extracting ${#archives[@]} coverage data archives"
          for archive in "${archives[@]}"; do
            tar -xzf "$archive"
          done
          ./gradlew jacocoRootReport --build-cache --configure-on-demand --parallel \
            -x javadoc -x check -DskipNestedConfigMetadataGen=true --quiet
          echo "COVERAGE_REPORT=$PWD/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml" >> "$GITHUB_ENV"
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: "cas-tests.coverage"
          path: ${{ env.COVERAGE_REPORT }}
      - name: Upload to SonarCloud
        if: env.SONARCLOUD_TOKEN != null
        continue-on-error: true
        run: |
          echo "Uploading coverage report to SonarCloud from $COVERAGE_REPORT"
          ./gradlew sonar --build-cache --configure-on-demand \
            -DskipAot=true -q --parallel --no-isolated-projects \
            -x javadoc -x test -DskipNestedConfigMetadataGen=true \
            -PsonarOrganization="${{ github.repository_owner }}" \
            -Dsonar.coverage.jacoco.xmlReportPaths="$COVERAGE_REPORT"
      - name: "Upload to Codecov"
        uses: "codecov/codecov-action@v7"
        continue-on-error: true
        if: env.CODECOV_TOKEN != null
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_REPORT }}
          verbose: true
          fail_ci_if_error: false
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.COVERAGE_REPORT }}
          format: jacoco
          build-number: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != null
        continue-on-error: true
        env:
          CODACY_REPORTER_OPTIONS: --http-timeout 60000 --num-retries 8 --sleep-time 15000
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r "$COVERAGE_REPORT"
