name: Build

env:
  JAVA_OPTS: "-Xms512m -Xmx6048m -Xss128m -XX:ReservedCodeCacheSize=512m -server"
  GRADLE_OPTS: "-Xms512m -Xmx6048m -Xss128m -XX:ReservedCodeCacheSize=512m -server"
  GRADLE_BUILD_OPTIONS: "--stacktrace --no-daemon -x check -x test -x javadoc --configure-on-demand --max-workers=8 "
  TERM: xterm-256color
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_PACKAGE_REGISTRY_USER: ${{ secrets.GH_PACKAGE_REGISTRY_USER }}
  GH_PACKAGE_REGISTRY_TOKEN: ${{ secrets.GH_PACKAGE_REGISTRY_TOKEN }}
  DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
  JDK_CURRENT: 25
  JDK_LATEST: 26
  JDK_DISTRIBUTION: "oracle"

##########################################################################

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
  #  push:
  #    branches: [ master ]
  pull_request:
    types: [ assigned ]
#    branches: [ master ]

##########################################################################

jobs:
  initialize:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    name: "Initialize Build"
    outputs:
      jdks: ${{ steps.determine-jdk.outputs.jdks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Determine JDKs
        id: determine-jdk
        shell: bash
        run: |
          if [ "$JDK_CURRENT" = "$JDK_LATEST" ]; then
            jq -nc \
              --arg version "$JDK_CURRENT" \
              --arg distribution "$JDK_DISTRIBUTION" \
              '[{version: $version, distribution: $distribution}]' \
              | sed 's/^/jdks=/' >> "$GITHUB_OUTPUT"
          else
            jq -nc \
              --arg current "$JDK_CURRENT" \
              --arg latest "$JDK_LATEST" \
              --arg distribution "$JDK_DISTRIBUTION" \
              '[
                {version: $current, distribution: $distribution},
                {version: $latest, distribution: "zulu"}
              ]' \
              | sed 's/^/jdks=/' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Initialize
        run: ls ./ci && find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh

  ##########################################################################

  build-pull-request:
    if: ${{ (github.event_name == 'pull_request' && github.event.assignee.login == 'apereocas-bot') }}
    runs-on: ubuntu-latest
    name: "Build Pull Request"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Initialize
        run: ls ./ci && find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh
      - name: Build with JDK ${{ env.JDK_CURRENT }}
        run: ./gradlew build -PsourceCompatibility=${{ env.JDK_CURRENT }} -PtargetCompatibility=${{ env.JDK_CURRENT }} ${{ env.GRADLE_BUILD_OPTIONS }}

        ##########################################################################

  build:
    needs: [initialize]
    continue-on-error: false
    runs-on: ubuntu-latest
    name: "Build"
    strategy:
      fail-fast: false
      matrix:
        jdks: ${{ fromJson(needs.initialize.outputs.jdks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK ${{ matrix.jdks.version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.jdks.version }}
          distribution: ${{ matrix.jdks.distribution }}
      - name: Set up Current JDK ${{ env.JDK_CURRENT }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Initialize
        run: find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh
        shell: bash
      - name: Build with JDK ${{ matrix.jdks.version }}
        run: ./gradlew build --quiet -PsourceCompatibility=${{ matrix.jdks.version }} -PtargetCompatibility=${{ matrix.jdks.version }} ${{ env.GRADLE_BUILD_OPTIONS }}
      - uses: actions/upload-artifact@v7
        with:
          name: binary-artifacts-${{ matrix.jdks.version }}
          path: ./**/build/libs/*.*

  ##########################################################################

  build-graalvm:
    runs-on: ubuntu-latest
    needs: [initialize]
    continue-on-error: false
    name: "Build Native"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm'
          java-version: 'latest-ea'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          set-java-home: 'true'
      - name: GraalVM Versions
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Initialize
        run: find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh
      - name: Build with Gradle
        timeout-minutes: 20
        run: chmod +x ./ci/tests/native/build.sh && ./ci/tests/native/build.sh
