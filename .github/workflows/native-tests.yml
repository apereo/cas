name: Native Image Tests

##########################################################################

env:
  JAVA_OPTS: "-Xms512m -Xmx6048m -Xss128m -XX:ReservedCodeCacheSize=512m -server"
  GRADLE_OPTS: "-Xms512m -Xmx6048m -Xss128m -XX:ReservedCodeCacheSize=512m -server"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_PACKAGE_REGISTRY_USER: ${{ secrets.GH_PACKAGE_REGISTRY_USER }}
  GH_PACKAGE_REGISTRY_TOKEN: ${{ secrets.GH_PACKAGE_REGISTRY_TOKEN }}
  DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
  DUO_SECURITY_ADMIN_SKEY: ${{ secrets.DUO_SECURITY_ADMIN_SKEY }}
  DUO_SECURITY_ADMIN_IKEY: ${{ secrets.DUO_SECURITY_ADMIN_IKEY }}
  DUO_SECURITY_UNIVERSAL_PROMPT_SKEY: ${{ secrets.DUO_SECURITY_UNIVERSAL_PROMPT_SKEY }}
  DUO_SECURITY_UNIVERSAL_PROMPT_IKEY: ${{ secrets.DUO_SECURITY_UNIVERSAL_PROMPT_IKEY }}
  DUO_SECURITY_API_HOST: ${{ secrets.DUO_SECURITY_API_HOST }}
  ADFS_HOST: ${{ secrets.ADFS_HOST }}
  ADFS_RELYING_PARTY_ID: ${{ secrets.ADFS_RELYING_PARTY_ID }}
  ADFS_USERNAME: ${{ secrets.ADFS_USERNAME }}
  ADFS_PASSWORD: ${{ secrets.ADFS_PASSWORD }}
  AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
  AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
  AZURE_AD_CLIENT_SECRET_MAIL: ${{ secrets.AZURE_AD_CLIENT_SECRET_MAIL }}
  AZURE_AD_USER_PASSWORD: ${{ secrets.AZURE_AD_USER_PASSWORD }}
  AZURE_AD_TENANT: ${{ secrets.AZURE_AD_TENANT }}
  AZURE_AD_DOMAIN: ${{ secrets.AZURE_AD_DOMAIN }}
  AZURE_MAPS_API_KEY: ${{ secrets.AZURE_MAPS_API_KEY }}
  AZURE_MAPS_CLIENT_ID: ${{ secrets.AZURE_MAPS_CLIENT_ID }}
  TERM: xterm-256color
  JDK_CURRENT: 25
  GRAALVM_VERSION: '25.4'
  JDK_DISTRIBUTION: "corretto"
  NODE_CURRENT: '26.11.1'
  MAX_ATTEMPTS: 1
  RETRY_MINUTES: 20
  SCENARIO_REGEX: ${{ github.event.inputs.scenarioRegex || '.*' }}

on:
#  push:
#    branches: [ master ]
  workflow_dispatch:
    inputs:
      scenarioRegex:
        description: 'Scenarios'
        required: false
        default: '.*'
        type: string
      retryFailedScenarios:
        description: 'Retry Previous Run'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 10 */2 * *'

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: true
  
##########################################################################

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Initialize
        run: ls ./ci && find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh

  ##########################################################################
            
  puppeteer-scenarios:
    needs: [initialize]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      scenarios255: ${{ steps.get-scenarios.outputs.scenarios255 }}
      scenarios511: ${{ steps.get-scenarios.outputs.scenarios511 }}
      scenarios766: ${{ steps.get-scenarios.outputs.scenarios766 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_CURRENT }}
          distribution: ${{ env.JDK_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: List Scenarios
        shell: bash
        run: ./gradlew --build-cache --configure-on-demand -q puppeteerScenarios > "$RUNNER_TEMP/puppeteer-scenarios.json"
      - name: Select Previously Failed Scenarios
        if: ${{ inputs.retryFailedScenarios }}
        shell: bash
        run: |
          workflow_file="$(basename "${GITHUB_WORKFLOW_REF%@*}")"
          previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?status=completed&per_page=20" \
            --jq "first(.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})) | {id, html_url, conclusion}")"
          if [[ -z "${previous_run}" ]]; then
            echo "::error::No completed run of ${workflow_file} was found to retry"
            exit 1
          fi
          previous_run_id="$(jq -r .id <<< "${previous_run}")"
          previous_run_url="$(jq -r .html_url <<< "${previous_run}")"
          echo "Selecting failed scenarios from ${previous_run_url} ($(jq -r .conclusion <<< "${previous_run}"))"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | .name' \
            | jq -R . | jq -s 'unique' > "$RUNNER_TEMP/failed-jobs.json"
          jq -c --slurpfile failed "$RUNNER_TEMP/failed-jobs.json" '[.[] | select(IN($failed[0][]))]' \
            "$RUNNER_TEMP/puppeteer-scenarios.json" > "$RUNNER_TEMP/failed-scenarios.json"
          mv "$RUNNER_TEMP/failed-scenarios.json" "$RUNNER_TEMP/puppeteer-scenarios.json"
          count="$(jq length "$RUNNER_TEMP/puppeteer-scenarios.json")"
          if [[ "${count}" -eq 0 ]]; then
            echo "::notice::No failed scenarios found in ${previous_run_url}; nothing to retry"
          fi
          {
            echo "### Retrying ${count} failed scenario(s) from [run ${previous_run_id}](${previous_run_url})"
            jq -r '.[] | "- \(.)"' "$RUNNER_TEMP/puppeteer-scenarios.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: get-scenarios
        name: Split Scenarios
        shell: bash
        run: |
          jq . "$RUNNER_TEMP/puppeteer-scenarios.json"
          {
            echo "scenarios255=$(jq -c '.[0:255]' "$RUNNER_TEMP/puppeteer-scenarios.json")"
            echo "scenarios511=$(jq -c '.[255:511]' "$RUNNER_TEMP/puppeteer-scenarios.json")"
            echo "scenarios766=$(jq -c '.[511:766]' "$RUNNER_TEMP/puppeteer-scenarios.json")"
          } >> "$GITHUB_OUTPUT"

  ##########################################################################
  puppeteer-tests-255:
    runs-on: ubuntu-latest
    needs: [puppeteer-scenarios]
    if: ${{ needs.puppeteer-scenarios.outputs.scenarios255 != '[]' }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{fromJSON(needs.puppeteer-scenarios.outputs.scenarios255)}}
    name: ${{matrix.scenario}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize
        run: find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh
      - name: Configure CI
        run: source ./ci/tests/puppeteer/configure-ci.sh ${{matrix.scenario}}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: "Setup Graal VM"
        uses: graalvm/setup-graalvm@v1
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          distribution: 'graalvm'
          version: ${{ env.GRAALVM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'true'
      - name: Set up Nodejs
        uses: actions/setup-node@v7
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION_REQUIRED }}
          cache: 'npm'
          cache-dependency-path: ./ci/tests/puppeteer/package.json
          check-latest: true
      - name: Build Native Tests
        uses: nick-fields/retry@v4
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          max_attempts: ${{ env.MAX_ATTEMPTS }}
          timeout_minutes: ${{ env.RETRY_MINUTES }}
          retry_on: error
          shell: bash
          command: |
            ./ci/tests/puppeteer/run.sh --nb --scenario $PWD/ci/tests/puppeteer/scenarios/${{matrix.scenario}}
      - name: Run Native Tests
        uses: nick-fields/retry@v4
        if: ${{ env.NATIVE_RUN_ENABLED == 'true' }}
        with:
          max_attempts: ${{ env.MAX_ATTEMPTS }}
          timeout_minutes: 5
          retry_on: error
          shell: bash
          command: |
            ./ci/tests/puppeteer/run.sh --nr --scenario $PWD/ci/tests/puppeteer/scenarios/${{matrix.scenario}}
  ##########################################################################
  puppeteer-tests-511:
    runs-on: ubuntu-latest
    needs: [puppeteer-scenarios]
    if: ${{ needs.puppeteer-scenarios.outputs.scenarios511 != '[]' }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{fromJSON(needs.puppeteer-scenarios.outputs.scenarios511)}}
    name: ${{matrix.scenario}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize
        run: find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh
      - name: Configure CI
        run: ./ci/tests/puppeteer/configure-ci.sh ${{matrix.scenario}}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: "Setup Graal VM"
        uses: graalvm/setup-graalvm@v1
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          distribution: 'graalvm'
          version: ${{ env.GRAALVM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'true'
      - name: Set up Nodejs
        uses: actions/setup-node@v7
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION_REQUIRED }}
          cache: 'npm'
          cache-dependency-path: ./ci/tests/puppeteer/package.json
      - name: Build Native Tests
        uses: nick-fields/retry@v4
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          max_attempts: ${{ env.MAX_ATTEMPTS }}
          timeout_minutes: ${{ env.RETRY_MINUTES }}
          retry_on: error
          shell: bash
          command: |
            export RUNNER_OS=${{ runner.os }}
            ./ci/tests/puppeteer/run.sh --nb --scenario $PWD/ci/tests/puppeteer/scenarios/${{matrix.scenario}}
      - name: Run Native Tests
        uses: nick-fields/retry@v4
        if: ${{ env.NATIVE_RUN_ENABLED == 'true' }}
        with:
          max_attempts: ${{ env.MAX_ATTEMPTS }}
          timeout_minutes: 5
          retry_on: error
          shell: bash
          command: |
            export RUNNER_OS=${{ runner.os }}
            ./ci/tests/puppeteer/run.sh --nr --scenario $PWD/ci/tests/puppeteer/scenarios/${{matrix.scenario}}
  ##########################################################################
  puppeteer-tests-766:
    runs-on: ubuntu-latest
    needs: [puppeteer-scenarios]
    if: ${{ needs.puppeteer-scenarios.outputs.scenarios766 != '[]' }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{fromJSON(needs.puppeteer-scenarios.outputs.scenarios766)}}
    name: ${{matrix.scenario}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize
        run: find ./ci -type f -name "*.sh" -exec chmod +x "{}" \; && ./ci/init-build.sh
      - name: Configure CI
        run: ./ci/tests/puppeteer/configure-ci.sh ${{matrix.scenario}}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: "Setup Graal VM"
        uses: graalvm/setup-graalvm@v1
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          distribution: 'graalvm'
          version: ${{ env.GRAALVM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'true'
      - name: Set up Nodejs
        uses: actions/setup-node@v7
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION_REQUIRED }}
          cache: 'npm'
          cache-dependency-path: ./ci/tests/puppeteer/package.json
      - name: Build Native Tests
        uses: nick-fields/retry@v4
        if: ${{ env.NATIVE_BUILD_ENABLED == 'true' }}
        with:
          max_attempts: ${{ env.MAX_ATTEMPTS }}
          timeout_minutes: ${{ env.RETRY_MINUTES }}
          retry_on: error
          shell: bash
          command: |
            export RUNNER_OS=${{ runner.os }}
            ./ci/tests/puppeteer/run.sh --nb --scenario $PWD/ci/tests/puppeteer/scenarios/${{matrix.scenario}}
      - name: Run Native Tests
        uses: nick-fields/retry@v4
        if: ${{ env.NATIVE_RUN_ENABLED == 'true' }}
        with:
          max_attempts: ${{ env.MAX_ATTEMPTS }}
          timeout_minutes: 5
          retry_on: error
          shell: bash
          command: |
            export RUNNER_OS=${{ runner.os }}
            ./ci/tests/puppeteer/run.sh --nr --scenario $PWD/ci/tests/puppeteer/scenarios/${{matrix.scenario}}
