codecov:
  max_report_age: off
  strict_yaml_branch: master

parsers:
  jacoco:
    partials_as_hits: true

coverage:
  round: up
  range: "80...90"
  precision: 5
  status:
    project:
      default:
        # basic
        target: 90%
        threshold: 0%
        base: auto
       # advanced
        branches: 
          - master
        if_not_found: success
        if_ci_failed: error
        informational: false
        only_pulls: false
fixes:
  - "/home/runner/work/cas/cas/::"
