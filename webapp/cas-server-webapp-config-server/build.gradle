apply plugin: "org.apereo.cas.project-conventions"

apply plugin: "war"

ext {
    mainClassName = "org.apereo.cas.CasConfigurationServerWebApplication"
    publishMetadata = true
    projectMetadata = [
            title: "Spring Cloud Configuration Server",
            facets: ["web"],
            category: "Web Application"
    ]
}

apply plugin: "org.apereo.cas.spring-boot-conventions"

description = "Builds the CAS Spring Cloud Config Server web application for serving externalized configuration."

configurations {
    named("runtimeClasspath") {
        exclude(group: "jakarta.servlet", module: "jakarta.servlet-api")
        exclude(group: "jakarta.el", module: "jakarta.el-api")
        exclude(group: "org.glassfish.expressly", module: "expressly")
    }
}

dependencies {
    implementation libraries.springboottomcat
    implementation libraries.springcloudbootstrap
    
    implementation project(":webapp:cas-server-webapp-init-config-server")
}
