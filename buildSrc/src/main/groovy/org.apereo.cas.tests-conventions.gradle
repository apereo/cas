import org.apereo.cas.gradle.TestCategories
import org.apereo.cas.gradle.TestCategoryTagsValueSource
import org.gradle.api.tasks.testing.Test

def categoryTags = providers.of(TestCategoryTagsValueSource) {
    parameters.sourceDirectories.set(sourceSets.test.java.srcDirs.collect { it.absolutePath }.sort())
}.get()

TestCategories.values().each { testCategory ->
    if (categoryTags.contains(testCategory.name())) {
        def taskName = "test${testCategory.name()}"
        if (!tasks.getNames().contains(taskName)) {
            def jacocoTestExecutionResultsFile = project.layout.buildDirectory.file("jacoco/jacoco-${taskName}.exec").get().asFile
            def shouldWeTest = shouldTest(testCategory.name())
            def coverageEnabled = isCoverageEnabled()
            tasks.register(taskName, Test) {
                description = "Run unit/integration tests to verify the test category: ${testCategory.name()}"
                group = 'CAS Tests'
                testClassesDirs = sourceSets.test.output.classesDirs
                classpath = sourceSets.test.runtimeClasspath
                enabled = shouldWeTest
                if (coverageEnabled) {
                    outputs.file(jacocoTestExecutionResultsFile)
                }

                useJUnitPlatform {
                    includeTags testCategory.name()
                }

                def ptsEnabled = shouldWeTest && testCategory.ptsEnabled && Boolean.valueOf(System.getProperty('PTS_ENABLED') ?: 'true') && !publishReleases
                develocity.predictiveTestSelection {
                    enabled = ptsEnabled
                    mergeCodeCoverage = true
                }
                logger.info "Predictive test selection for ${project.name} with task ${taskName} is ${ptsEnabled ? 'enabled' : 'disabled'}."

                systemProperty('junit.platform.discovery.issue.severity.critical', 'info')
                systemProperty('junit.platform.execution.memory.cleanup.enabled', true)

                if (testCategory.parallelEnabled) {
                    systemProperty('junit.jupiter.execution.parallel.enabled', true)
                    systemProperty('junit.jupiter.execution.parallel.mode.default', 'concurrent')
                    systemProperty('junit.jupiter.execution.parallel.mode.classes.default', 'concurrent')
                    systemProperty('junit.jupiter.execution.parallel.config.strategy', 'dynamic')
                    systemProperty('junit.jupiter.execution.parallel.config.dynamic.factor', '2')
                    systemProperty('junit.jupiter.execution.parallel.config.executor-service', 'WORKER_THREAD_POOL')
                }

                if (coverageEnabled && !project.path.contains(':docs')) {
                    jacoco {
                        dumpOnExit = true
                        includes = ['org.apereo.*']
                        excludes = excludedFilesFromTestCoverage
                        destinationFile = jacocoTestExecutionResultsFile
                    }
                }
                jvmArgs += "-javaagent:${configurations.jvmAgents.asPath}"
            }
        }
    }
}

tasks.named('test') {
    enabled = false
    onlyIf = {
        false
    }
}

tasks.withType(Test).configureEach {
    scanForTestClasses = false
    ignoreFailures = providers.systemProperty('ignoreTestFailures').present
    forkEvery = 500

    systemProperty('spring.test.context.cache.maxSize',
        providers.systemProperty('testContextCacheSize').orElse('64').get())

    def defaultParallelForks = Math.max(1, (Runtime.runtime.availableProcessors() / 2).intValue())
    maxParallelForks = project.ext.has('testMaxParallelForks')
        ? project.ext.testMaxParallelForks as int
        : ci ? Math.min(2, defaultParallelForks) : defaultParallelForks

    failFast = true

    def list = []
    list.add('--enable-native-access=ALL-UNNAMED')
    list.add('--add-modules')
    list.add('java.se')

    list.add('--add-exports')
    list.add('java.base/jdk.internal.ref=ALL-UNNAMED')
    list.add('--add-exports')
    list.add('java.base/jdk.internal.misc=ALL-UNNAMED')
    list.add('--add-exports')
    list.add('java.xml.crypto/org.jcp.xml.dsig.internal.dom=ALL-UNNAMED')
    list.add('--add-exports')
    list.add('java.base/sun.nio.ch=ALL-UNNAMED')
    list.add('--add-exports')
    list.add('java.base/java.nio=ALL-UNNAMED')
    list.add('--add-exports')
    list.add('java.management/com.sun.jmx.mbeanserver=ALL-UNNAMED')
    list.add('--add-exports')
    list.add('jdk.internal.jvmstat/sun.jvmstat.monitor=ALL-UNNAMED')
    list.add('--add-exports')
    list.add('java.base/sun.reflect.generics.reflectiveObjects=ALL-UNNAMED')

    list.add('--add-opens')
    list.add('java.base/jdk.internal.misc=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/jdk.internal.access=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.lang=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.lang.reflect=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.lang.invoke=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.io=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.math=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.util=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.time=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.util.concurrent=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.util.concurrent.locks=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.net=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/java.nio=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.base/sun.nio.ch=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('java.management/sun.management=ALL-UNNAMED')
    list.add('--add-opens')
    list.add('jdk.management/com.sun.management.internal=ALL-UNNAMED')

    list.add('-Dio.netty.tryReflectionSetAccessible=true')

    list.add('-Xms512m')
    list.add('-Xmx4g')

    list.add('-Dspring.jmx.enabled=false')

    list.add('-XX:+EnableDynamicAgentLoading')
    jvmArgs = list

    testLogging {
        def testLoggingEvents = providers.systemProperty('testLoggingEvents')
            .orElse('PASSED,SKIPPED,FAILED,STANDARD_OUT,STANDARD_ERROR').get().toUpperCase().split(',')
        events testLoggingEvents
        exceptionFormat = 'full'

        def verbose = providers.systemProperty('verbose').present

        showStandardStreams = verbose && testLoggingEvents.contains('STANDARD_OUT')
        showExceptions = verbose && testLoggingEvents.contains('FAILED')
        showCauses = verbose

        quiet {
            events 'failed'
            exceptionFormat = 'full'
            showExceptions = true
            showCauses = true
            showStackTraces = true
        }
    }

    def skipRetry = providers.systemProperty('skipTestRetry').present
    if (!skipRetry) {
        develocity.testRetry {
            maxRetries = 3
            maxFailures = 5
            failOnPassedAfterRetry = false
        }
    }

    filter {
        setFailOnNoMatchingTests(false)
        excludeTestsMatching '*TestsSuite'
    }
}

def shouldTest(final String category) {
    def taskName = "test${category}"
    def foundTest = gradle.startParameter.taskNames.any { task -> task == taskName || task.endsWith(":${taskName}") }
    if (!foundTest) {
        logger.debug "No tests with category ${category} found"
    }
    !providers.systemProperty('skipTests').present && foundTest
}

def isCoverageEnabled() {
    providers.systemProperty('enableJacocoAgent').orElse('false').get().toBoolean() ||
        gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ENGLISH).contains('jacoco') }
}
