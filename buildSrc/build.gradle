plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    maven {
        name = "MavenCentralMirror"
        url = "https://maven-central.storage-download.googleapis.com/maven2/"
        mavenContent { releasesOnly() }
    }
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation libs.spring.boot.loader.tools
}
