apply plugin: "org.apereo.cas.project-conventions"

description = "Apereo CAS Model Context Protocol (MCP) server."
ext {
    publishMetadata = true
    projectMetadata = [
            category: "AI",
            title: "MCP Server",
            aliases: ["mcp"]
    ]
}
dependencies {
    implementation libraries.springai
    implementation libraries.nimbus
    implementation libraries.jose4j
    implementation libraries.springsecurityconfig
    implementation libraries.springsecurityweb
    
    implementation project(":core:cas-server-core-authentication-api")
    implementation project(":core:cas-server-core-util-api")
    implementation project(":core:cas-server-core-web-api")
    implementation project(":core:cas-server-core-events-api")
    implementation project(":core:cas-server-core-services-api")
    implementation project(":core:cas-server-core-tickets-api")
    implementation project(":core:cas-server-core-audit-api")
    implementation project(":core:cas-server-core-services-registry")
    implementation project(":core:cas-server-core-services-authentication")
    implementation project(":core:cas-server-core-webflow-api")
    implementation project(":core:cas-server-core-validation-api")
    implementation project(":core:cas-server-core-logout-api")
    implementation project(":core:cas-server-core-cookie-api")
    implementation project(":core:cas-server-core-configuration-api")
    implementation project(":core:cas-server-core-authentication-mfa-api")

    implementation project(":support:cas-server-support-person-directory-core")

    compileOnly project(":support:cas-server-support-consent-api")
    compileOnly project(":support:cas-server-support-saml-idp-core")
    compileOnly project(":support:cas-server-support-oauth-services")
    compileOnly project(":support:cas-server-support-oidc-services")
    compileOnly project(":support:cas-server-support-oidc-core-api")
    compileOnly project(":support:cas-server-support-trusted-mfa-core")
    compileOnly project(":support:cas-server-support-surrogate-api")
    compileOnly project(":support:cas-server-support-interrupt-api")
    compileOnly project(":support:cas-server-support-electrofence")
    
    compileOnly libraries.opensaml
    compileOnly libraries.shibutiljavasupport
    
    testImplementation libraries.opensaml
    testImplementation libraries.shibutiljavasupport
    
    testImplementation project(":support:cas-server-support-person-directory")
    testImplementation project(":support:cas-server-support-consent-api")
    testImplementation project(":support:cas-server-support-consent-core")
    testImplementation project(":support:cas-server-support-saml-idp-core")
    testImplementation project(":support:cas-server-support-oauth-services")
    testImplementation project(":support:cas-server-support-oidc-services")
    testImplementation project(":support:cas-server-support-oidc-core-api")
    testImplementation project(":support:cas-server-support-trusted-mfa-core")
    testImplementation project(":support:cas-server-support-surrogate-api")
    testImplementation project(":support:cas-server-support-interrupt-api")
    testImplementation project(":support:cas-server-support-electrofence")
    testImplementation project(":support:cas-server-support-webconfig")
    testImplementation project(":support:cas-server-support-themes")
    testImplementation project(":support:cas-server-support-thymeleaf")

    testImplementation project(":core:cas-server-core")
    testImplementation project(":core:cas-server-core-notifications")
    testImplementation project(":core:cas-server-core-util")
    testImplementation project(":core:cas-server-core-scripting")
    testImplementation project(":core:cas-server-core-authentication")
    testImplementation project(":core:cas-server-core-configuration")
    testImplementation project(":core:cas-server-core-tickets")
    testImplementation project(":core:cas-server-core-services")
    testImplementation project(":core:cas-server-core-logout")
    testImplementation project(":core:cas-server-core-cookie")
    testImplementation project(":core:cas-server-core-web")
    testImplementation project(":core:cas-server-core-webflow")
    testImplementation project(":core:cas-server-core-authentication-mfa")
    testImplementation project(":core:cas-server-core-webflow-mfa")
    testImplementation project(":core:cas-server-core-authentication-attributes")

    testImplementation project(path: ":core:cas-server-core-authentication-api", configuration: "tests")
    testImplementation project(path: ":core:cas-server-core-authentication", configuration: "tests")
    testImplementation project(path: ":core:cas-server-core-services", configuration: "tests")
    testImplementation project(path: ":core:cas-server-core-util", configuration: "tests")
    testImplementation project(path: ":core:cas-server-core-util-api", configuration: "tests")
    testImplementation project(path: ":core:cas-server-core-audit-api", configuration: "tests")
    testImplementation project(path: ":core:cas-server-core-authentication-mfa-api", configuration: "tests")
}
