<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout(mainContentClass='container-xxl py-3')}">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title th:text="#{screen.pm.reset.title}">Reset Password Send Instructions View</title>
    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/account.css}" />
</head>

<body>
<main class="container mt-3 mb-3">
    <div layout:fragment="content" id="reset">
        <div th:replace="~{fragments/accountflow :: shell(flow='reset', step=1, steps=5, content=~{::flowContent})}">
            <div th:fragment="flowContent">
                <form method="post" id="fm1" class="cas-flow-form">
                    <section>
                        <div>
                            <h2 th:utext="#{screen.pm.reset.title}">Reset your password</h2>
                            <p class="cas-flow-intro" th:utext="#{screen.pm.reset.instructions}">Please provide your username.
                                You will receive a notification with follow-up instructions on how to reset your password.</p>
                        </div>
                        <div class="alert alert-danger acct-banner acct-banner-error" role="alert"
                             th:if="${flowRequestContext.messageContext.hasErrorMessages()}">
                            <i class="mdi mdi-alert-circle-outline" aria-hidden="true"></i>
                            <div class="acct-banner-body">
                                <p th:each="message : ${flowRequestContext.messageContext.allMessages}" th:text="${message.text}">Message Text</p>
                            </div>
                        </div>

                        <span th:if="${recaptchaPasswordManagementEnabled}">
                            <div th:replace="~{fragments/recaptcha :: recaptchaToken}" />
                        </span>

                        <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
                        <input type="hidden" name="_eventId" value="findAccount" />
                        <label class="cas-flow-field" for="username">
                            <span th:utext="#{screen.pm.reset.username}">Username</span>
                            <input class="acct-input" type="text" name="username" id="username"
                                   autocapitalize="none" spellcheck="false" autocomplete="username" required />
                        </label>
                    </section>
                    <div class="cas-flow-actions">
                        <div th:replace="~{fragments/submitbutton :: submitButton (messageKey='screen.pm.button.submit', iconClass='mdi-send-outline')}" />
                        <button class="acct-btn" name="cancel" type="button" onclick="location.href = location.href;"
                                th:value="#{screen.pm.button.cancel}" th:text="#{screen.pm.button.cancel}">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>

</html>
