<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout(mainContentClass='container-xxl py-3')}">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title th:text="#{screen.pm.reset.title}">Reset Password Verify Questions View</title>
    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/account.css}" />
    <script type="text/javascript" th:src="@{/js/account.js}"></script>
</head>

<body>
<main class="container mt-3 mb-3">
    <div layout:fragment="content">
        <div th:replace="~{fragments/accountflow :: shell(flow='reset', step=3, steps=5, content=~{::flowContent})}">
            <div th:fragment="flowContent">
                <h2 th:utext="#{screen.pm.reset.qstitle}">Answer Security Questions</h2>
                <p class="cas-flow-intro" th:utext="#{screen.pm.reset.qsmsg(${username})}">Welcome <strong>casuser</strong>.
                    Before you can reset your password, you must answer the following security questions.</p>
                <form method="post" id="fm1" class="cas-flow-form">
                    <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
                    <input type="hidden" name="_eventId" value="submit" />
                    <input type="hidden" name="username" th:value="${username}" />
                    <input type="hidden" name="token" th:value="${token}" />
                    <th:block th:if="${questionsEnabled}">
                        <label class="cas-flow-field" th:each="q, iterStat : ${questions}" th:for="${'q' + iterStat.index}">
                            <span th:id="${'question' + iterStat.index}" th:text="${q}">What was your favorite food growing up?</span>
                            <span class="cas-flow-input-row">
                                <input class="acct-input pwd" type="password"
                                       th:name="${'q' + iterStat.index}" th:id="${'q' + iterStat.index}"
                                       th:attr="aria-describedby=${'answerHint' + iterStat.index},data-caps-check='capsLockWarning'"
                                       autocomplete="off" required />
                                <button th:if="${iterStat.first}" class="acct-btn acct-btn-icon reveal-password" type="button"
                                        aria-pressed="false" th:aria-label="#{screen.pm.password.toggle}" th:title="#{screen.pm.password.toggle}">
                                    <i class="mdi mdi-eye reveal-password-icon" aria-hidden="true"></i>
                                </button>
                            </span>
                            <span class="visually-hidden" th:id="${'answerHint' + iterStat.index}"
                                  th:text="#{screen.pm.reset.answer(${iterStat.count})}">Answer 1</span>
                        </label>
                    </th:block>
                    <p id="capsLockWarning" class="cas-flow-caps" role="status" hidden th:utext="#{screen.capslock.on}">CAPSLOCK key is turned on!</p>
                    <div class="cas-flow-actions">
                        <button class="acct-btn acct-btn-primary" type="submit" name="submit"
                                th:attr="data-processing-text=#{screen.welcome.button.loginwip}"
                                th:value="#{screen.pm.button.submit}" value="SUBMIT"
                                th:text="#{screen.pm.button.submit}">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>

</html>
