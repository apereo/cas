<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout(mainContentClass='container-xxl py-3')}">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title th:text="#{screen.success.header}">Password Update Success View</title>
    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/account.css}" />
</head>

<body>
<main class="container mt-3 mb-3">
    <div layout:fragment="content" th:with="resetFlow=${flowRequestContext.activeFlow.id == 'pswdreset'}">
        <div th:replace="~{fragments/accountflow :: shell(flow=${resetFlow ? 'reset' : 'password'}, step=${resetFlow ? 5 : 3}, steps=${resetFlow ? 5 : 3}, content=~{::flowContent})}">
            <div th:fragment="flowContent" role="status">
                <div th:replace="~{fragments/accountflow :: status(kind='success', heading=#{screen.pm.success.header}, message=#{screen.pm.success.message})}"></div>
                <form method="post" id="form" class="cas-flow-actions" th:action="@{/login}">
                    <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
                    <input type="hidden" name="_eventId" value="proceed" />
                    <div th:replace="~{fragments/submitbutton :: submitButton (messageKey='screen.welcome.button.login', name='continue')}"/>
                </form>
            </div>
        </div>
    </div>
</main>
</body>

</html>
