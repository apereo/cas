<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout(mainContentClass='container-xxl py-3')}">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title th:text="#{screen.pm.weak.title}">Password Weak Error View</title>
    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/account.css}" />
</head>

<body>
<main class="container mt-3 mb-3">
    <div layout:fragment="content">
        <div th:replace="~{fragments/accountflow :: shell(flow='password', step=1, steps=3, content=~{::flowContent})}">
            <div th:fragment="flowContent" role="alert">
                <div th:replace="~{fragments/accountflow :: status(kind='warning', heading=#{screen.pm.weak.heading}, message=#{screen.pm.weak.message})}"></div>
                <form method="post" id="fm1" class="cas-flow-actions">
                    <input type="hidden" name="execution" th:value="${flowExecutionKey}"/>
                    <input type="hidden" name="_eventId" value="continue"/>
                    <button class="acct-btn acct-btn-primary" type="submit" name="submit" id="submit"
                            th:text="#{screen.button.continue}">Continue</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>

</html>
