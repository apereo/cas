<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <title th:text="#{cas.login.pagetitle}">Passwordless Display View</title>
    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag"/>
</head>

<body>
<main class="container mt-3 mb-3">
    <div layout:fragment="content" id="login" class="mdc-card card mdc-card-content w-lg-50 p-4 m-auto cas-hero cas-hero-start">
        <span class="cas-hero-icon" aria-hidden="true"><i class="mdi mdi-email-fast-outline"></i></span>
        <h3 th:text="#{passwordless.token.header}">Provide Token</h3>
        <p th:text="#{passwordless.token.description}"></p>
        <div id="passwordlessMessages" class="banner banner-danger alert alert-danger mb-2"
             th:if="${flowRequestContext.messageContext.hasErrorMessages()}">
            <span th:each="message : ${flowRequestContext.messageContext.allMessages}" th:utext="${message.text}">Message Text</span>
        </div>
        <div class="banner banner-danger alert alert-danger mb-2" th:if="${error}">
            <strong th:text="#{passwordless.error.failure.title}"></strong>
            <p th:text="#{passwordless.error.failure.description}"></p>
        </div>
        <form method="post" id="fm1" class="d-block" th:action="@{/login}">
            <input type="hidden" name="_eventId_submit" value="LOGIN" />
            <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
            <div class="cas-field form-group my-3">
                <div class="w-100">
                    <label for="token" class="mdc-text-field mdc-text-field--outlined control-label">
                        <span class="mdc-notched-outline">
                            <span class="mdc-notched-outline__leading"></span>
                            <span class="mdc-notched-outline__notch">
                                <span class="mdc-floating-label" th:utext="#{screen.welcome.label.token}">Token</span>
                            </span>
                            <span class="mdc-notched-outline__trailing"></span>
                        </span>
                        <input class="mdc-text-field__input form-control" type="text" name="token" id="token" size="25"
                               autocapitalize="none" spellcheck="false" autocomplete="one-time-code" required />
                    </label>
                </div>
            </div>
            <div class="d-flex">
                <div th:replace="~{fragments/submitbutton :: submitButton (messageKey='screen.welcome.button.login')}"/>

                <a class="mdc-button mdc-button--outline btn btn-outline-secondary button-cancel" id="cancel" name="cancel" th:href="@{/login}">
                    <span class="mdc-button__label" th:text="#{screen.consent.cancel}">Cancel</span>
                </a>
            </div>
        </form>
        <script type="text/javascript">
            if ("OTPCredential" in window) {
                const webOtpAbort = new AbortController();
                $("#fm1").on("submit", () => webOtpAbort.abort());
                navigator.credentials.get({otp: {transport: ["sms"]}, signal: webOtpAbort.signal})
                    .then(otp => {
                        if (otp && otp.code) {
                            $("#token").val(otp.code);
                            $("#fm1").submit();
                        }
                    })
                    .catch(err => console.debug("WebOTP did not provide a code", err));
            }
        </script>
    </div>
</main>
</body>

</html>
