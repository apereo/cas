<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns="http://www.w3.org/1999/html"
      layout:decorate="~{layout}">

<head>
    <title th:text="#{cas.oauth.confirm.pagetitle}"></title>
</head>

<body id="cas">
<div layout:fragment="content" class="banner mdc-card card p-4 m-auto w-lg-66 cas-consent">

    <div id="scopeContainer" class="d-none">
        <div th:replace="~{fragments/consent :: appHeader(${service.name}, ${service.description}, ${service.logo}, #{screen.oauth.confirm.header})}"/>

        <div id="dynamic" th:if="${dynamic}"
             class="my-2 banner banner-warning alert alert-warning d-flex align-items-center">
            <i class="mdi mdi-alert fas fa-exclamation-triangle me-2" aria-hidden="true"></i>
            <strong th:utext="#{screen.oidc.confirm.dynamic(${dynamicTime})}"/>
        </div>

        <section id="scopes" class="cas-consent-section" th:unless="${#sets.isEmpty(scopes)}">
            <h3 th:text="#{screen.oidc.confirm.scopes}"/>
            <p class="cas-consent-hint" th:text="#{screen.oidc.confirm.asksinfo}"/>
            <ul class="cas-perm-list">
                <th:block th:each="scope : ${scopes}"><li th:replace="~{fragments/consent :: permission(${scope}, ${#messages.msgOrNull('screen.oidc.confirm.scope.' + scope)}, 'scope')}"/></th:block>
            </ul>
        </section>

        <section id="userInfoClaims" class="cas-consent-section" th:unless="${#sets.isEmpty(userInfoClaims)}">
            <h3 th:text="#{screen.oidc.confirm.claims}"/>
            <ul class="cas-perm-list cas-perm-list-compact">
                <th:block th:each="claim : ${userInfoClaims}"><li th:replace="~{fragments/consent :: permission(${claim}, ${#messages.msgOrNull('screen.oidc.confirm.claim.' + claim)}, 'claim')}"/></th:block>
            </ul>
        </section>

        <p class="cas-consent-question" th:text="#{screen.oauth.confirm.message(${service.name})}"/>

        <div class="cas-consent-actions">
            <a th:if="${deniedApprovalUrl}" th:href="@{${deniedApprovalUrl}}"
               class="mdc-button mdc-button--outline btn btn-outline-secondary" id="deny" name="deny" href="/">
                <span class="mdc-button__label" th:utext="#{screen.oauth.confirm.deny}"></span>
            </a>
            <a th:unless="${deniedApprovalUrl}" class="mdc-button mdc-button--outline btn btn-outline-secondary button-cancel"
               id="cancel" name="cancel" th:href="@{/login}">
                <span class="mdc-button__label" th:text="#{screen.oauth.confirm.deny}">Cancel</span>
            </a>
            <a class="mdc-button mdc-button--raised btn btn-primary drop-button"
               id="allow"
               name="allow"
               th:href="@{${callbackUrl}}">
                <span class="mdc-button__label" th:utext="#{screen.oauth.confirm.allow}"></span>
            </a>
        </div>

        <div class="cas-consent-links" th:if="${service.informationUrl != null or service.privacyUrl != null}">
            <a th:if="${service.informationUrl}" id="informationUrl" th:href="${service.informationUrl}">
                <i class="mdi mdi-information-outline" aria-hidden="true"></i>
                <span th:utext="#{screen.oidc.confirm.infourl(${service.name})}"/>
            </a>
            <a th:if="${service.privacyUrl}" id="privacyUrl" th:href="${service.privacyUrl}">
                <i class="mdi mdi-shield-lock-outline" aria-hidden="true"></i>
                <span th:utext="#{screen.oidc.confirm.privacyurl(${service.name})}"/>
            </a>
        </div>
    </div>

    <div id="progressPanel" class="d-none">
        <h2 id="processingTitle" th:utext="#{screen.processing.title}"></h2>
        <p id="processingText" th:utext="#{screen.oauth.confirm.processing}"></p>
        <div id="progressBar" role="progressbar" class="mdc-linear-progress mdc-linear-progress--indeterminate">
            <div class="mdc-linear-progress__buffer">
                <div class="mdc-linear-progress__buffer-bar"></div>
                <div class="mdc-linear-progress__buffer-dots"></div>
            </div>
            <div class="mdc-linear-progress__bar mdc-linear-progress__primary-bar">
                <span class="mdc-linear-progress__bar-inner"></span>
            </div>
            <div class="mdc-linear-progress__bar mdc-linear-progress__secondary-bar">
                <span class="mdc-linear-progress__bar-inner"></span>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        const approvalKey = /*[[${approvalKey}]]*/ "";
        const recordKey = /*[[${recordKey}]]*/ "";
        handleScopeApproval(approvalKey, recordKey, "cas-oidc-consent-scope");
    </script>
    
</div>

</body>
</html>
