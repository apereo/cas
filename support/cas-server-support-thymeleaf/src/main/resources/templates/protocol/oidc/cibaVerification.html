<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <title th:text="#{cas.oauth.confirm.pagetitle}"></title>
</head>

<body id="cas">
<div layout:fragment="content" style="box-shadow: unset">

    <div id="confirmation" class="banner banner-info mdc-card card p-2 m-auto w-lg-50" style="display: none">
        <h2 th:utext="#{screen.oidc.confirm.ciba.header}">Success</h2>
        <p th:utext="#{screen.oidc.confirm.ciba.confirmed}" class="intro">Authentication request is now confirmed.</p>
    </div>
    
    <div id="cibaContainer" class="banner mdc-card card p-4 m-auto w-lg-66 cas-consent">
        <div th:replace="~{fragments/consent :: appHeader(${registeredService.name}, ${registeredService.description}, ${registeredService.logo}, #{screen.oidc.confirm.ciba.header})}"/>

        <div id="bindingMessageSection" class="cas-binding" th:if="${bindingMessage}">
            <h3 class="cas-consent-eyebrow" th:utext="#{screen.oidc.confirm.bindingmessage.header}">Binding Message</h3>
            <pre id="bindingMessage" class="cas-binding-code" th:text="${bindingMessage}"/>
            <p class="cas-consent-hint" th:text="#{screen.oidc.confirm.bindingmessage.description}"/>
        </div>

        <section id="scopes" class="cas-consent-section" th:unless="${#sets.isEmpty(cibaRequest.scopes)}">
            <h3 th:text="#{screen.oidc.confirm.scopes}"/>
            <p class="cas-consent-hint" th:text="#{screen.oidc.confirm.asksinfo}"/>
            <ul class="cas-perm-list">
                <th:block th:each="scope : ${cibaRequest.scopes}"><li th:replace="~{fragments/consent :: permission(${scope}, ${#messages.msgOrNull('screen.oidc.confirm.scope.' + scope)}, 'scope')}"/></th:block>
            </ul>
        </section>

        <div class="cas-ciba-form">
            <form id="fm1" method="post">
                <section id="userCodeSection" th:if="${userCodeRequired}" class="cas-field my-3 mdc-input-group form-group">
                    <div class="mdc-input-group-field mdc-input-group-field-append">
                        <div class="d-flex caps-check">
                            <label for="userCode"
                                   class="mdc-text-field mdc-text-field--outlined mdc-text-field--with-trailing-icon control-label">
                                <span class="mdc-notched-outline">
                                    <span class="mdc-notched-outline__leading"></span>
                                    <span class="mdc-notched-outline__notch">
                                        <span class="mdc-floating-label" th:utext="#{screen.oidc.confirm.usercode.header}">User Code</span>
                                    </span>
                                    <span class="mdc-notched-outline__trailing"></span>
                                </span>
                                <input class="mdc-text-field__input form-control pwd"
                                       type="password"
                                       name="userCode"
                                       id="userCode"
                                       size="50"
                                       autocomplete="one-time-code" required/>
                            </label>

                            <button class="reveal-password mdc-button mdc-button--raised mdc-input-group-append mdc-icon-button"
                                    tabindex="-1"
                                    type="button" th:title="#{screen.pm.password.toggle}">
                                <i class="mdi mdi-eye reveal-password-icon" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="mdc-text-field-helper-line caps-warn">
                            <p class="mdc-text-field-helper-text mdc-text-field-helper-text--persistent mdc-text-field-helper-text--validation-msg text-danger">
                                <span th:utext="#{screen.capslock.on}"/>
                            </p>
                        </div>
                        <sub th:text="#{screen.oidc.confirm.usercode.description}"/>
                    </div>
                </section>

                <div id="error" class="banner banner-danger banner-dismissible mdc-card card p-2 m-auto w-100" style="display: none">
                    <h2 th:utext="#{screen.oidc.confirm.ciba.header}">Error</h2>
                    <p th:utext="#{screen.oidc.confirm.ciba.failed}" class="intro mt-0">Failed to confirm authentication request.</p>
                </div>
                <div class="cas-consent-actions">
                    <div th:replace="~{fragments/submitbutton :: submitButton (messageKey='screen.welcome.button.confirm', id='confirmButton')}"/>
                </div>
                <input type="hidden" id="loginCsrfToken" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="cibaRequestId" th:value="${cibaRequest.id}"/>

                <script type="text/javascript">
                    document.addEventListener("DOMContentLoaded", (event) => {
                        const form = document.getElementById("fm1");
                        form.submit = () => false;
                        $("#fm1").submit(function (event) {
                            event.preventDefault();
                            const formData = $(this).serialize();
                            console.log(formData);

                            const csrfToken = $('#loginCsrfToken').val();
                            console.log(`CSRF Token: ${csrfToken}`);
                            
                            $.ajax({
                                type: "POST",
                                url: location.href,
                                data: formData,
                                headers: {
                                    "X-CSRF-TOKEN": csrfToken
                                },
                                success: (response, status, xhr) => {
                                    if (xhr.status === 200) {
                                        $("#error").hide();
                                        $("#cibaContainer").hide().empty();
                                        $("#confirmation").show();
                                    }
                                },
                                error: (xhr, status, error) => {
                                    $("#error").show();
                                    $("#confirmation").hide();
                                    $("#confirmButton").prop("disabled", false);
                                }
                            });
                        })
                    });
                </script>
            </form>
        </div>
        <div class="cas-consent-links" th:if="${registeredService.informationUrl != null or registeredService.privacyUrl != null}">
            <a th:if="${registeredService.informationUrl}" id="informationUrl" th:href="${registeredService.informationUrl}">
                <i class="mdi mdi-information-outline" aria-hidden="true"></i>
                <span th:utext="#{screen.oidc.confirm.infourl(${registeredService.name})}"/>
            </a>
            <a th:if="${registeredService.privacyUrl}" id="privacyUrl" th:href="${registeredService.privacyUrl}">
                <i class="mdi mdi-shield-lock-outline" aria-hidden="true"></i>
                <span th:utext="#{screen.oidc.confirm.privacyurl(${registeredService.name})}"/>
            </a>
        </div>
    </div>
</div>
</body>
</html>
