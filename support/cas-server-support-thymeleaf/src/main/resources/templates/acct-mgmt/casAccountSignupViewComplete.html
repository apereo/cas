<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout(mainContentClass='container-xxl py-3')}">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title th:text="#{cas.screen.acct.title}">Account Registration</title>

    <script type="text/javascript" th:src="@{#{webjars.zxcvbn.js}}"></script>
    <script type="text/javascript" th:src="@{/js/passwordMeter.js}"></script>

    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/account.css}"/>
    <script type="text/javascript" th:src="@{/js/account.js}"></script>
</head>

<body id="cas">
<main class="container mt-3 mb-3">
    <div layout:fragment="content">
        <script th:inline="javascript">
            /*<![CDATA[*/

            let policyPattern = /*[[${passwordPolicyPattern}]]*/;
            let passwordStrengthI18n = {
                0: /*[[#{screen.pm.password.strength.0}]]*/,
                1: /*[[#{screen.pm.password.strength.1}]]*/,
                2: /*[[#{screen.pm.password.strength.2}]]*/,
                3: /*[[#{screen.pm.password.strength.3}]]*/,
                4: /*[[#{screen.pm.password.strength.4}]]*/
            };
            let passwordMinimumStrength = 0;
            /*]]>*/
        </script>

        <div th:replace="~{fragments/accountflow :: shell(flow='signup', step=3, steps=4, content=~{::flowContent})}">
            <div th:fragment="flowContent">
                <h2 th:utext="#{cas.screen.acct.title}">Account Registration</h2>
                <p class="cas-flow-intro" th:utext="#{cas.screen.acct.intro.complete}">Welcome back! Thank you for verifying your account.</p>

                <form method="post" id="fm1" class="cas-flow-form">
                    <div class="alert alert-danger acct-banner acct-banner-error" role="alert"
                         th:if="${flowRequestContext.messageContext.hasErrorMessages()}">
                        <i class="mdi mdi-alert-circle-outline" aria-hidden="true"></i>
                        <div class="acct-banner-body">
                            <p th:each="message : ${flowRequestContext.messageContext.allMessages}"
                               th:utext="${message.text}">Message Text</p>
                        </div>
                    </div>

                    <div class="cas-flow-field">
                        <label for="password" th:utext="#{screen.pm.enterpsw}">Enter Password:</label>
                        <span class="cas-flow-input-row">
                            <input class="acct-input pwd"
                                   autocapitalize="none"
                                   spellcheck="false"
                                   th:attr="pattern=${passwordPolicyPattern}"
                                   type="password"
                                   name="password"
                                   id="password"
                                   data-caps-check="signupCapsLockWarning"
                                   aria-describedby="password-strength-notes"
                                   autocomplete="new-password" required/>
                            <button class="acct-btn acct-btn-icon reveal-password" type="button" aria-pressed="false"
                                    th:aria-label="#{screen.pm.password.toggle}" th:title="#{screen.pm.password.toggle}">
                                <i class="mdi mdi-eye reveal-password-icon" aria-hidden="true"></i>
                            </button>
                        </span>
                        <div th:replace="~{fragments/accountflow :: strengthMeter}"></div>
                    </div>

                    <div class="cas-flow-field">
                        <label for="confirmedPassword" th:utext="#{screen.pm.confirmpsw}">Confirm Password:</label>
                        <input class="acct-input pwd"
                               type="password"
                               autocapitalize="none"
                               spellcheck="false"
                               th:attr="pattern=${passwordPolicyPattern}"
                               name="confirmedPassword"
                               id="confirmedPassword"
                               data-caps-check="signupCapsLockWarning"
                               autocomplete="new-password" required/>
                    </div>
                    <p id="signupCapsLockWarning" class="cas-flow-caps" role="status" hidden th:utext="#{screen.capslock.on}">CAPSLOCK key is turned on!</p>

                    <fieldset class="cas-flow-questions" th:if="${accountRegistrationSecurityQuestionsCount gt 0}">
                        <legend th:text="#{screen.account.flow.signup.questions}">Security questions</legend>
                        <div class="cas-flow-question" th:each="count : ${#numbers.sequence(1, accountRegistrationSecurityQuestionsCount)}">
                            <label class="cas-flow-field" th:for="${'securityquestion' + count}">
                                <span th:utext="#{${'screen.acct.label.security.question.' + count}}">Security Question</span>
                                <input class="acct-input"
                                       th:id="${'securityquestion' + count}"
                                       th:name="${'securityquestion' + count}"
                                       type="text"
                                       autocapitalize="none"
                                       spellcheck="false"/>
                            </label>
                            <label class="cas-flow-field" th:for="${'securityanswer' + count}">
                                <span th:utext="#{screen.acct.label.security.answer}">Answer</span>
                                <input class="acct-input pwd"
                                       autocapitalize="none"
                                       spellcheck="false"
                                       type="password"
                                       th:id="${'securityanswer' + count}"
                                       th:name="${'securityanswer' + count}"
                                       data-caps-check="signupCapsLockWarning"
                                       autocomplete="off" required/>
                            </label>
                        </div>
                    </fieldset>

                    <input type="hidden" name="execution" th:value="${flowExecutionKey}"/>
                    <input type="hidden" name="_eventId" value="submit"/>
                    <div class="cas-flow-actions">
                        <div th:replace="~{fragments/submitbutton :: submitButton (name='submit', id='submit', messageKey='cas.screen.acct.button.submit', iconClass='mdi-check')}"/>
                        <a class="acct-btn" th:href="@{/login}" th:text="#{cas.screen.acct.button.cancel}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
