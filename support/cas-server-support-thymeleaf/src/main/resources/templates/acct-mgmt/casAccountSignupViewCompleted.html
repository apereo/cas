<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout(mainContentClass='container-xxl py-3')}">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title th:text="#{cas.screen.acct.title}">Account Registration</title>
    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/account.css}"/>

    <script type="text/javascript" th:src="@{#{webjars.sweet-alert.js}}"></script>
    <link rel="stylesheet" type="text/css" th:href="@{#{webjars.sweet-alert.css}}" />
</head>

<body id="cas">
<main class="container mt-3 mb-3">
    <div layout:fragment="content">
        <div th:replace="~{fragments/accountflow :: shell(flow='signup', step=4, steps=4, content=~{::flowContent})}">
            <div th:fragment="flowContent">
                <div th:replace="~{fragments/accountflow :: status(kind='success', heading=#{cas.screen.acct.title}, message=#{cas.screen.acct.intro.completed})}"></div>
                <div class="cas-flow-actions" th:unless="${service}">
                    <a class="acct-btn acct-btn-primary" th:href="@{/login}" th:text="#{screen.account.flow.backtologin}">Back to sign in</a>
                </div>
            </div>
        </div>

        <span th:if="${service}" th:remove="tag">
            <script th:inline="javascript">
                /*<![CDATA[*/
                const fullRequestUrl = /*[[${fullRequestUrl}]]*/;
                console.info("Redirecting to", fullRequestUrl);
                /*]]>*/
                
                Swal.fire({
                    title: 'Redirecting to Application',
                    text: 'CAS is preparing to redirect to the original application...',
                    timer: 2500,
                    timerProgressBar: true,  
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                    showConfirmButton: false,
                    showCancelButton: false,
                    didOpen: () => {
                        Swal.showLoading(); 
                    },
                    willClose: () => {
                        window.location.href = fullRequestUrl;
                    }
                });
            </script>
        </span>
    </div>
</main>
</body>
</html>
