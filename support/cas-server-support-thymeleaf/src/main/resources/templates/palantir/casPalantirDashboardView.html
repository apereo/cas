    <!--/*
        Applies the stored theme and zen mode before anything paints, so a dark dashboard does not flash light
        and the navigation does not flash in zen mode.
        palantir-theme.js takes over once the scripts have loaded. It also opts the page out of the
        shared autofocus in cas.js, which would otherwise put focus in the first search box and keep
        the keyboard shortcuts from working until the operator clicked elsewhere.
    */-->
    <script>
        (() => {
            let preference = "system";
            try {
                preference = window.localStorage.getItem("PalantirTheme") || "system";
            } catch (e) {
                preference = "system";
            }
            const dark = preference === "dark" || (preference !== "light"
                && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            document.documentElement.setAttribute("data-theme-preference", preference);
            document.documentElement.classList.add("palantir-page");
            try {
                if (window.localStorage.getItem("PalantirZenMode") === "true") {
                    document.documentElement.setAttribute("data-palantir-zen", "");
                }
            } catch (e) {
                document.documentElement.removeAttribute("data-palantir-zen");
            }
            document.documentElement.dataset.casAutofocus = "false";
        })();
    </script>
