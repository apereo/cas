<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body id="cas">
<main class="container mt-3 mb-3">
    <div layout:fragment="content" id="login">
        <span th:remove="tag" th:if="${#cas.isTrue(#cas.theme('cas.browser-storage.show-progress'))}">
            <div id="mainPanel" class="mdc-card p-4 m-auto w-lg-50 cas-hero">
                <span class="cas-hero-icon" aria-hidden="true"><i class="mdi mdi-database-sync-outline"></i></span>
                <h2 id="processingTitle" th:utext="#{screen.processing.title}"></h2>
                <p id="processingText" th:utext="#{screen.processing.text}"></p>
                <div id="progressBar" role="progressbar" class="mdc-linear-progress mdc-linear-progress--indeterminate">
                    <div class="mdc-linear-progress__buffer">
                        <div class="mdc-linear-progress__buffer-bar"></div>
                        <div class="mdc-linear-progress__buffer-dots"></div>
                    </div>
                    <div class="mdc-linear-progress__bar mdc-linear-progress__primary-bar">
                        <span class="mdc-linear-progress__bar-inner"></span>
                    </div>
                    <div class="mdc-linear-progress__bar mdc-linear-progress__secondary-bar">
                        <span class="mdc-linear-progress__bar-inner"></span>
                    </div>
                </div>
            </div>
        </span>
        <div id="errorPanel" class="my-2 banner banner-danger alert alert-warning hide"></div>
        <span th:remove="tag" th:if="${'false' == #strings.defaultString(#cas.theme('cas.browser-storage.show-progress'), 'true')}">
           <style type="text/css" id="browserStorageHideBody">body {display:none;}</style>
           <noscript><style type="text/css">body {display:block !important;}</style></noscript>
        </span>
        
        <form method="post" id="fm1">
            <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
            <input type="hidden" name="_eventId" value="continue" />
            <input type="submit" style="display: none" />
        </form>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', () => {
                function handleError(e) {
                    console.error(e);
                    document.getElementById("browserStorageHideBody")?.remove();
                    document.getElementById("mainPanel")?.classList.add('hide');
                    const errorPanel = document.getElementById("errorPanel");
                    errorPanel.classList.remove('hide');

                    const title = document.createElement("h3");
                    title.textContent = [[#{ screen.browserstorage.failure.title }]];
                    const description = document.createElement("p");
                    description.textContent = [[#{ screen.browserstorage.failure.message }]];
                    const details = document.createElement("p");
                    details.append(document.createElement("code"));
                    details.firstChild.textContent = String(e);
                    errorPanel.replaceChildren(title, description, details);
                }
                
                /*<![CDATA[*/

                try {
                    const browserStorage = /*[[${browserStorage}]]*/ ;
                    if (writeToBrowserStorage(browserStorage)) {
                        let url = browserStorage.destinationUrl;
                        if (url !== undefined && url !== "" && url !== null) {
                            window.location.href = url;
                        } else {
                            document.getElementById("fm1").submit();
                        }
                    } else {
                        handleError("Failed to write to browser storage or cookies. Both may be full, unavailable, or blocked by the browser.");
                    }
                } catch (e) {
                    handleError(e);
                }
                
                /*]]>*/
            });

        </script>

        <noscript>
            <p>
                <style type="text/css">
                    #mainPanel {display:none;}
                </style>
                <div class="mdc-card p-4 m-auto w-lg-50 banner banner-danger alert alert-danger">
                    <h2 th:utext="#{screen.browser.js.disabled.title}"></h2>
                    <p class="intro" th:utext="#{screen.browser.js.disabled.text}"></p>
                </div>
            </p>
        </noscript>
    </div>
</main>
</body>
</html>
