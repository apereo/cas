<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Password Management Links Fragment</title>
    <link href="../../static/css/cas.css" rel="stylesheet" th:remove="tag" />
</head>

<body>
    <div th:fragment="pmlinks" id="pmlinks" class="my-2">
        <form th:if="${accountRegistrationEnabled}" method="post" id="accountMgmtSignupForm">
            <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
            <input type="hidden" name="_eventId" value="signup" />
            <span class="mdi mdi-account-group" aria-hidden="true"></span>
            <a id="accountSignUpLink" th:utext="#{screen.acct.button.signUp}" href="javascript:void(0)"
               onclick="document.getElementById('accountMgmtSignupForm').submit()" />
            <br><br>
        </form>
        <form th:if="${passwordManagementEnabled}" method="post" id="passwordManagementForm">
            <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
            <input type="hidden" name="_eventId" value="resetPassword" />
            <span class="mdi mdi-lock-open" aria-hidden="true"></span>
            <a id="forgotPasswordLink" th:utext="#{screen.pm.button.resetPassword}" href="javascript:void(0)"
                onclick="document.getElementById('passwordManagementForm').submit();" />
            <br><br>
        </form>
        <form th:if="${#cas.isTrue(passwordManagementEnabled) && #cas.isTrue(forgotUsernameEnabled)}" method="post" id="forgotUsernameForm">
            <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
            <input type="hidden" name="_eventId" value="forgotUsername" />
            <span class="mdi mdi-account-question" aria-hidden="true"></span>
            <a id="forgotUsernameLink" th:utext="#{screen.pm.button.forgotUsername}" href="javascript:void(0)"
                onclick="document.getElementById('forgotUsernameForm').submit();" />
            <br><br>
        </form>
        <th:block th:unless="${passwordManagementEnabled}">
            <div id="forgotPasswordExternal" class="mt-2"
                 th:if="${#cas.themeBuilderEnabled or !#strings.isEmpty(#cas.theme('cas.pm-links.forgot-password.url'))}"
                 th:classappend="${#strings.isEmpty(#cas.theme('cas.pm-links.forgot-password.url'))} ? 'cas-theme-builder-off'"
                 data-cas-theme-builder-toggle="cas.pm-links.forgot-password.url">
                <span class="mdi mdi-account-question" aria-hidden="true"></span>
                <span th:utext="#{screen.pm.button.forgotpwd(${#strings.escapeXml(#cas.theme('cas.pm-links.forgot-password.url'))})}">Forgot your password?</span>
            </div>
        </th:block>
    </div>
</body>

</html>
