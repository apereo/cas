<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
</head>
<body>
<span th:fragment="main">
    <!--/*
        The rail mirrors the account profile's (fragments/accountprofile/accountprofilenavigation.html):
        a fixed column of icon-over-label destinations, the selected one a white pill, and the
        settings and sign-out actions pinned to the bottom. On narrow screens it becomes a full-screen
        grid opened from the "Sections" button on the main panel.

        Each destination is a real <button> inside its list item. The list item keeps the id, the
        data-tab-index and the active class, so every existing selector and hideElements(...) call
        still resolves. The visible label is the button's accessible name; a shortened label carries
        the full section name as its title. Only destinations live in list items: the scripts treat
        every "nav.sidebar-navigation ul li" as one.
    */-->
    <nav id="palantirNavigation" class="sidebar-navigation" aria-label="Palantir sections">
        <div class="sidebar-navigation-head">
            <span>Palantir sections</span>
            <button type="button" class="sidebar-navigation-close" data-palantir-action="close-sections">Close</button>
        </div>
        <ul>
            <li id="applicationsTabButton" class="active" data-tab-index="0">
                <button type="button" class="sidebar-navigation-button" aria-current="page">
                    <i class="mdi mdi-apps" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Applications</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="systemTabButton" data-tab-index="1">
                <button type="button" class="sidebar-navigation-button">
                    <i class="mdi mdi-laptop" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">System</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="ticketsTabButton" data-tab-index="2">
                <button type="button" class="sidebar-navigation-button">
                    <i class="mdi mdi-database" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Tickets</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="tasksTabButton" data-tab-index="3">
                <button type="button" class="sidebar-navigation-button">
                    <i class="mdi mdi-tire" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Tasks</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="accessStrategyTabButton" data-tab-index="4">
                <button type="button" class="sidebar-navigation-button" title="Access Strategy">
                    <i class="mdi mdi-shield-check" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Access</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="loggingTabButton" data-tab-index="5">
                <button type="button" class="sidebar-navigation-button">
                    <i class="mdi mdi-text" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Logs &amp; Audits</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="ssoSessionsTabButton" data-tab-index="6">
                <button type="button" class="sidebar-navigation-button">
                    <i class="mdi mdi-account-multiple" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">SSO Sessions</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="configurationTabButton" data-tab-index="7">
                <button type="button" class="sidebar-navigation-button" title="CAS Configuration">
                    <i class="mdi mdi-wrench" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Configuration</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="personDirectoryTabButton" data-tab-index="8">
                <button type="button" class="sidebar-navigation-button" title="Attribute Resolution">
                    <i class="mdi mdi-card-account-details" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Attributes</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="authenticationTabButton" data-tab-index="9">
                <button type="button" class="sidebar-navigation-button" title="Authentication">
                    <i class="mdi mdi-account-check" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Auth</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="consentTabButton" data-tab-index="10">
                <button type="button" class="sidebar-navigation-button" title="Attribute Consent">
                    <i class="mdi mdi-checkerboard" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Consent</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="protocolsTabButton" data-tab-index="11">
                <button type="button" class="sidebar-navigation-button" title="Authentication Protocols">
                    <i class="mdi mdi-protocol" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Protocols</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="throttlesTabButton" data-tab-index="12">
                <button type="button" class="sidebar-navigation-button" title="Throttled Authentication">
                    <i class="mdi mdi-account-lock" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Throttles</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="mfaTabButton" data-tab-index="13">
                <button type="button" class="sidebar-navigation-button" title="Multifactor Authentication">
                    <i class="mdi mdi-two-factor-authentication" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">MFA</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="tenantsTabButton" data-tab-index="14">
                <button type="button" class="sidebar-navigation-button" title="Multitenancy">
                    <i class="mdi mdi-home-circle" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Tenants</span>
                </button>
            </li>
            <li th:if="${isRoleAdmin}" id="clusterTabButton" data-tab-index="15">
                <button type="button" class="sidebar-navigation-button" title="Cluster &amp; High Availability">
                    <i class="mdi mdi-server" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Cluster</span>
                </button>
            </li>
        </ul>
        <ul class="sidebar-navigation-actions">
            <li th:if="${isRoleAdmin}" id="palantirSettingsTabButton" data-tab-index="100">
                <button type="button" class="sidebar-navigation-button" title="Palantir Settings">
                    <i class="mdi mdi-cog-outline" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Settings</span>
                </button>
            </li>
            <li id="palantirLogoutButton" data-tab-index="200">
                <button type="button" class="sidebar-navigation-button">
                    <i class="mdi mdi-logout-variant" aria-hidden="true"></i>
                    <span class="sidebar-navigation-label">Sign out</span>
                </button>
            </li>
        </ul>
    </nav>
</span>
</body>
</html>
