<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
</head>
<body>
<span th:fragment="main">
    <div class="attribute-tab w-100 d-none" id="attribute-tab-12">
        <h3>Throttled Authentications</h3>
        <form id="fmThrottlesUsername" class="passwordless-account-search throttles-username-search mt-3 mb-3"
              aria-label="Show the throttled attempts of a username">
            <label for="throttlesUsername"
                   class="mdc-text-field mdc-text-field--outlined mdc-text-field--with-leading-icon passwordless-account-search-field">
                <i class="mdi mdi-account-search mdc-text-field__icon mdc-text-field__icon--leading" aria-hidden="true"></i>
                <input class="mdc-text-field__input form-control" type="text" name="throttlesUsername" id="throttlesUsername"
                       autocomplete="off" spellcheck="false" aria-labelledby="throttlesUsernameLabel"
                       aria-describedby="throttlesUsernameHint"/>
                <span class="mdc-notched-outline">
                    <span class="mdc-notched-outline__leading"></span>
                    <span class="mdc-notched-outline__notch">
                        <span class="mdc-floating-label" id="throttlesUsernameLabel">Username</span>
                    </span>
                    <span class="mdc-notched-outline__trailing"></span>
                </span>
            </label>
            <button type="submit" id="filterThrottlesButton" class="mdc-button mdc-button--raised passwordless-account-search-button">
                <span class="mdc-button__label">
                    <i class="mdc-tab__icon mdi mdi-filter-variant" aria-hidden="true"></i>Show Attempts
                </span>
            </button>
            <button type="button" id="showAllThrottlesButton" class="mdc-button mdc-button--outlined passwordless-account-search-button" hidden>
                <span class="mdc-button__label">
                    <i class="mdc-tab__icon mdi mdi-close" aria-hidden="true"></i>Show All
                </span>
            </button>
        </form>
        <p id="throttlesUsernameHint" class="throttles-username-hint" aria-live="polite">
            Every throttled attempt is shown; enter a username to see only that username's attempts, matched regardless of case.
        </p>
        <table id="throttlesTable" class="mdc-data-table__table table table-striped noborder">
            <thead>
            <tr class="mdc-data-table__header-row">
                <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Key</th>
                <th class="mdc-data-table__header-cell" role="columnheader" scope="col">ID</th>
                <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Date</th>
                <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Username</th>
                <th class="mdc-data-table__header-cell" role="columnheader" scope="col">IP Address</th>
                <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Expiration</th>
            </tr>
            </thead>
            <tbody class="mdc-data-table__content">
            </tbody>
        </table>

        <div class="d-flex">
            <button data-palantir-write="throttles" type="button" name="clearThrottlesButton" id="clearThrottlesButton"
                    class="mdc-button mdc-button--raised">
                <span class="mdc-button__label">
                    <i class="mdc-tab__icon mdi mdi-delete"
                       aria-hidden="true"></i>Clear</span>
            </button>
            <button data-palantir-write="throttles" type="button" name="releaseThrottlesButton" id="releaseThrottlesButton"
                    class="mdc-button mdc-button--raised">
                <span class="mdc-button__label">
                    <i class="mdc-tab__icon mdi mdi-broom" aria-hidden="true"></i>Release</span>
            </button>
        </div>
    </div>
</span>
</body>
</html>
