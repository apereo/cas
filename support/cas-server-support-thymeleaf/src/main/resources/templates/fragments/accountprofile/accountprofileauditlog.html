<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<section th:fragment="auditlog" th:if="${auditLog}" id="divAuditLog" class="profile-content" hidden
         aria-labelledby="divAuditLogTitle"
         th:data-account-trail="|#{screen.account.trail.root} › #{screen.account.group.activity} › #{screen.account.auditlog.title}|">
    <header>
        <div>
            <h2 id="divAuditLogTitle" th:utext="#{screen.account.auditlog.title}">Audit Log</h2>
            <p th:utext="#{screen.account.auditlog.subtitle}">Examine the CAS audit log here.</p>
        </div>
    </header>
    <ul id="auditLogList" class="cas-account-list" data-account-list
        th:unless="${#lists.isEmpty(auditLog)}"
        th:attr="data-filter-label=#{screen.account.list.filter},data-more-label=#{screen.account.list.more},data-count-label=#{screen.account.list.count}">
        <li class="cas-account-item" th:each="entry, iter : ${auditLog}"
            th:with="failed=${#strings.contains(entry.actionPerformed, 'FAIL')}">
            <div class="cas-account-item-row">
                <span class="cas-account-item-icon" aria-hidden="true"><i class="mdi mdi-history"></i></span>
                <div class="cas-account-item-body">
                    <div class="cas-account-item-title">
                        <span class="acct-mono" th:id="${'auditTitle' + iter.index}" th:text="${entry.actionPerformed}">AUTHENTICATION_SUCCESS</span>
                        <span class="cas-account-tag" th:classappend="${failed} ? 'is-failure' : 'is-success'"
                              th:text="${failed} ? #{screen.account.auditlog.failure} : #{screen.account.auditlog.success}">Success</span>
                    </div>
                    <div class="cas-account-item-meta">
                        <span th:text="${#cas.format(entry.whenActionWasPerformed, 'MMMM dd, yyyy')}">October 2, 2026</span>
                        · <span th:text="${entry.clientInfo.clientIpAddress}">192.0.2.14</span>
                        · <span th:data-account-useragent="${entry.clientInfo.userAgent}"
                                th:text="${#strings.abbreviate(entry.clientInfo.userAgent, 60)}" th:title="${entry.clientInfo.userAgent}">Chrome · macOS</span>
                    </div>
                    <div class="cas-account-item-meta" th:text="${entry.resourceOperatedUpon}">Resource</div>
                </div>
                <div class="cas-account-item-actions">
                    <button type="button" name="viewAuditEntryDetails" class="acct-btn acct-btn-text"
                            data-account-toggle aria-expanded="false"
                            th:attr="aria-controls=${'auditDetails' + iter.index},aria-describedby=${'auditTitle' + iter.index},data-label-show=#{screen.account.item.details},data-label-hide=#{screen.account.item.hide}"
                            th:text="#{screen.account.item.details}">Details</button>
                </div>
            </div>
            <div class="cas-account-item-details" th:id="${'auditDetails' + iter.index}" hidden>
                <pre data-account-json th:text="${entry.json}">{}</pre>
            </div>
        </li>
    </ul>
    <p class="cas-account-empty" th:if="${#lists.isEmpty(auditLog)}"
       th:text="#{screen.account.auditlog.empty}">No audit records to display.</p>
</section>
</body>
</html>
