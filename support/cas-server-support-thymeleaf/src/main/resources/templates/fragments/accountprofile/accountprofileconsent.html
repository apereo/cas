<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<section th:fragment="consent" th:if="${consentDecisions}" id="divConsentDecisions" class="profile-content" hidden
         aria-labelledby="divConsentDecisionsTitle"
         th:data-account-trail="|#{screen.account.trail.root} › #{screen.account.group.privacy} › #{screen.account.nav.consent}|">
    <header>
        <div>
            <h2 id="divConsentDecisionsTitle" th:utext="#{screen.account.consent.title}">Attribute Consent Decisions</h2>
            <p th:utext="#{screen.account.consent.subtitle}">Examine the CAS Attribute Consent Decisions here.</p>
        </div>
    </header>
    <ul id="consentDecisionsList" class="cas-account-list" data-account-list
        th:unless="${#lists.isEmpty(consentDecisions)}"
        th:attr="data-filter-label=#{screen.account.list.filter},data-more-label=#{screen.account.list.more},data-count-label=#{screen.account.list.count}">
        <li class="cas-account-item" th:each="entry, iter : ${consentDecisions}">
            <div class="cas-account-item-row">
                <span class="cas-account-item-icon" aria-hidden="true"><i class="mdi mdi-checkbox-marked-outline"></i></span>
                <div class="cas-account-item-body">
                    <div class="cas-account-item-title">
                        <span class="acct-mono" th:id="${'consentTitle' + iter.index}" th:text="${entry.service}">https://app.example.org</span>
                        <span class="cas-account-tag" th:utext="#{${entry.options}}">Always</span>
                        <span class="cas-account-tag" th:text="#{screen.account.consent.reminder(${entry.reminder})}">Reminder</span>
                    </div>
                    <div class="cas-account-item-meta">
                        <span th:text="${entry.attributes}">mail, displayName</span>
                        · <span th:text="${#temporals.format(entry.createdDateTime, 'MMMM dd, yyyy HH:mm:ss') + ' UTC'}">October 2, 2026</span>
                    </div>
                </div>
                <div class="cas-account-item-actions">
                    <button type="button" name="viewConsentEntryDetails" class="acct-btn acct-btn-text"
                            data-account-toggle aria-expanded="false"
                            th:attr="aria-controls=${'consentDetails' + iter.index},aria-describedby=${'consentTitle' + iter.index},data-label-show=#{screen.account.item.details},data-label-hide=#{screen.account.item.hide}"
                            th:text="#{screen.account.item.details}">Details</button>
                </div>
            </div>
            <div class="cas-account-item-details" th:id="${'consentDetails' + iter.index}" hidden>
                <pre data-account-json th:text="${entry.json}">{}</pre>
            </div>
        </li>
    </ul>
    <p class="cas-account-empty" th:if="${#lists.isEmpty(consentDecisions)}"
       th:text="#{screen.account.consent.empty}">No consent decisions to display.</p>
</section>
</body>
</html>
