<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<section th:fragment="trusteddevices" th:if="${multifactorTrustedDevices}" id="divMultifactorTrustedDevices" class="profile-content" hidden
         aria-labelledby="divMultifactorTrustedDevicesTitle"
         th:data-account-trail="|#{screen.account.trail.root} › #{screen.account.group.security} › #{screen.account.nav.trusteddevices}|">
    <header>
        <div>
            <h2 id="divMultifactorTrustedDevicesTitle" th:utext="#{screen.account.trusteddevices.title}">Multifactor Authentication Trusted Devices</h2>
            <p th:utext="#{screen.account.trusteddevices.subtitle}">Trusted Devices are listed here</p>
        </div>
    </header>
    <ul id="trustedDevicesList" class="cas-account-list" data-account-list
        th:unless="${#lists.isEmpty(multifactorTrustedDevices)}"
        th:attr="data-filter-label=#{screen.account.list.filter},data-more-label=#{screen.account.list.more},data-count-label=#{screen.account.list.count}">
        <li class="cas-account-item" th:each="entry, iter : ${multifactorTrustedDevices}">
            <div class="cas-account-item-row">
                <span class="cas-account-item-icon" aria-hidden="true"><i class="mdi mdi-shield-check-outline"></i></span>
                <div class="cas-account-item-body">
                    <div class="cas-account-item-title">
                        <span th:id="${'trustedDeviceTitle' + iter.index}" th:text="${entry.name} ?: 'N/A'">MacBook Pro</span>
                        <span class="cas-account-tag" th:if="${entry.source}" th:text="${entry.source}">Google Authenticator</span>
                        <span class="cas-account-tag" th:if="${entry.expirationDateTime}"
                              th:text="#{screen.account.trusteddevices.expires(${entry.expirationDateTime})}">Expires</span>
                    </div>
                    <div class="cas-account-item-meta">
                        <span th:text="#{screen.account.trusteddevices.id}">ID</span> <span class="acct-mono" th:text="${entry.id} ?: 'N/A'">1001</span>
                        · <span th:text="#{screen.account.trusteddevices.key}">Key</span> <span class="acct-mono" th:text="${entry.model} ?: 'N/A'" th:title="${entry.model}">a6f3e1</span>
                        · <span th:text="#{screen.account.trusteddevices.fingerprint}">Fingerprint</span> <span class="acct-mono" th:text="${entry.type} ?: 'N/A'" th:title="${entry.type}">9b1c2d</span>
                        · <span th:text="#{screen.account.trusteddevices.created}">Created</span> <span th:text="${entry.lastUsedDateTime} ?: 'N/A'">2026-09-30</span>
                    </div>
                </div>
                <div class="cas-account-item-actions" th:if="${entry.payload}">
                    <button type="button" name="viewTrustedDeviceDetails" class="acct-btn acct-btn-text"
                            data-account-toggle aria-expanded="false"
                            th:attr="aria-controls=${'trustedDeviceDetails' + iter.index},aria-describedby=${'trustedDeviceTitle' + iter.index},data-label-show=#{screen.account.item.details},data-label-hide=#{screen.account.item.hide}"
                            th:text="#{screen.account.item.details}">Details</button>
                    <form method="post" th:action="@{/account#divMultifactorTrustedDevices}">
                        <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
                        <input type="hidden" name="key" th:value="${entry.model}" />
                        <input type="hidden" name="_eventId" value="deleteTrustedDevice" />
                        <button type="submit" name="deleteTrustedDevice" class="acct-btn acct-btn-text acct-btn-danger"
                                th:attr="aria-describedby=${'trustedDeviceTitle' + iter.index}"
                                th:text="#{screen.account.trusteddevices.remove}">Remove trust</button>
                    </form>
                </div>
            </div>
            <div class="cas-account-item-details" th:if="${entry.payload}" th:id="${'trustedDeviceDetails' + iter.index}" hidden>
                <pre data-account-json th:text="${entry.payload}">{}</pre>
            </div>
        </li>
    </ul>
    <p class="cas-account-empty" th:if="${#lists.isEmpty(multifactorTrustedDevices)}"
       th:text="#{screen.account.trusteddevices.empty}">No trusted devices to display.</p>
</section>
</body>
</html>
