<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<nav th:fragment="navigation" id="navigationMenu" class="cas-account-rail" th:aria-label="#{screen.account.nav.label}">
    <div class="cas-account-rail-head">
        <span th:text="#{screen.account.nav.label}">Account sections</span>
        <button type="button" class="acct-btn acct-btn-on-brand" data-account-action="close-sections"
                th:text="#{screen.account.nav.close}">Close</button>
    </div>
    <ul>
        <li>
            <a id="linkOverview" class="cas-account-rail-link" href="#divOverview" data-account-panel="#divOverview">
                <i class="mdi mdi-home-outline" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.overview}">Overview</span>
            </a>
        </li>
        <li class="cas-account-rail-divider" aria-hidden="true"></li>
        <li>
            <a id="linkAttributes" class="cas-account-rail-link" href="#divAttributes" data-account-panel="#divAttributes">
                <i class="mdi mdi-format-list-bulleted" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.attributes}">Attributes</span>
            </a>
        </li>
        <li>
            <a id="linkSessions" class="cas-account-rail-link" href="#divSessions" data-account-panel="#divSessions">
                <i class="mdi mdi-monitor" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.sessions}">Sessions</span>
            </a>
        </li>
        <li th:if="${authorizedServices}">
            <a id="linkApplications" class="cas-account-rail-link" href="#divApplications" data-account-panel="#divApplications">
                <i class="mdi mdi-apps" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.applications}">Apps</span>
            </a>
        </li>
        <li th:if="${!#lists.isEmpty(oidcAccessTokens)}">
            <a id="linkOidcAccessTokens" class="cas-account-rail-link" href="#divOidcAccessTokens" data-account-panel="#divOidcAccessTokens">
                <i class="mdi mdi-key-outline" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.tokens}">Tokens</span>
            </a>
        </li>
        <li class="cas-account-rail-divider" aria-hidden="true"
            th:if="${multifactorRegisteredAccounts != null || multifactorTrustedDevices != null || #cas.isTrue(securityQuestionsEnabled)}"></li>
        <li th:if="${multifactorRegisteredAccounts}">
            <a id="linkMfaRegisteredAccounts" class="cas-account-rail-link" href="#divMfaRegisteredAccounts" data-account-panel="#divMfaRegisteredAccounts">
                <i class="mdi mdi-cellphone-key" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.mfadevices}">MFA devices</span>
            </a>
        </li>
        <li th:if="${multifactorTrustedDevices}">
            <a id="linkMfaTrustedDevices" class="cas-account-rail-link" href="#divMultifactorTrustedDevices" data-account-panel="#divMultifactorTrustedDevices">
                <i class="mdi mdi-shield-check-outline" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.trusteddevices}">Trusted</span>
            </a>
        </li>
        <li th:if="${securityQuestionsEnabled}">
            <a id="linkSecurityQuestions" class="cas-account-rail-link" href="#divSecurityQuestions" data-account-panel="#divSecurityQuestions">
                <i class="mdi mdi-help-circle-outline" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.questions}">Questions</span>
            </a>
        </li>
        <li class="cas-account-rail-divider" aria-hidden="true" th:if="${consentDecisions != null || auditLog != null}"></li>
        <li th:if="${consentDecisions}">
            <a id="linkConsentDecisions" class="cas-account-rail-link" href="#divConsentDecisions" data-account-panel="#divConsentDecisions">
                <i class="mdi mdi-checkbox-marked-outline" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.consent}">Consent</span>
            </a>
        </li>
        <li th:if="${auditLog}">
            <a id="linkAuditLog" class="cas-account-rail-link" href="#divAuditLog" data-account-panel="#divAuditLog">
                <i class="mdi mdi-history" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.audit}">Audit</span>
            </a>
        </li>
    </ul>
    <ul class="cas-account-rail-actions">
        <li th:if="${passwordManagementEnabled != null && passwordManagementEnabled}">
            <button type="button" id="linkPasswordManagement" class="cas-account-rail-link"
                    data-account-action="password"
                    th:attr="data-confirm-title=#{screen.account.pwreset.title},data-confirm-text=#{screen.account.pwreset},data-confirm-button=#{screen.account.continue},data-cancel-button=#{screen.account.cancel}">
                <i class="mdi mdi-form-textbox-password" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.password}">Reset password</span>
            </button>
            <form method="post" id="fmChangePsw" name="fmChangePsw">
                <input type="hidden" name="execution" th:value="${flowExecutionKey}"/>
                <input type="hidden" name="_eventId" value="resetPassword"/>
            </form>
        </li>
        <li>
            <button type="button" id="linkLogout" class="cas-account-rail-link"
                    data-account-action="logout"
                    th:attr="data-logout-url=@{/logout},data-confirm-title=#{screen.account.logout.title},data-confirm-text=#{screen.account.logout.confirm},data-confirm-button=#{screen.account.nav.logout},data-cancel-button=#{screen.account.cancel}">
                <i class="mdi mdi-logout-variant" aria-hidden="true"></i>
                <span th:text="#{screen.account.nav.logout}">Sign out</span>
            </button>
        </li>
    </ul>
</nav>
</body>
</html>
