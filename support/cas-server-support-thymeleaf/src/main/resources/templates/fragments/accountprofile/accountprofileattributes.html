<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<section th:fragment="attributes" id="divAttributes" class="profile-content" hidden aria-labelledby="divAttributesTitle"
         th:data-account-trail="|#{screen.account.trail.root} › #{screen.account.group.privacy} › #{screen.account.attributes.title}|">
    <header>
        <div>
            <h2 id="divAttributesTitle" th:text="#{screen.account.attributes.title}">Attributes</h2>
            <p th:utext="#{screen.account.attributes}">These are the attributes that CAS has found and attached to your authenticated profile.</p>
        </div>
    </header>
    <div class="cas-account-attributes">
        <section class="cas-account-card" aria-labelledby="principalAttributesTitle">
            <h3 id="principalAttributesTitle" th:text="#{screen.account.attributes.principal}">Principal attributes</h3>
            <dl id="principalAttributesList" data-account-list
                th:attr="data-filter-label=#{screen.account.list.filter},data-more-label=#{screen.account.list.more},data-count-label=#{screen.account.list.count}">
                <div th:each="attribute : ${authentication.principal.attributes}">
                    <dt th:text="${attribute.key}">displayName</dt>
                    <dd th:text="${#strings.abbreviate(attribute.value, 80)}" th:title="${attribute.value}">[CAS User]</dd>
                </div>
            </dl>
        </section>
        <section class="cas-account-card" aria-labelledby="authenticationAttributesTitle">
            <h3 id="authenticationAttributesTitle" th:text="#{screen.account.attributes.authentication}">Authentication attributes</h3>
            <dl id="authenticationAttributesList" data-account-list
                th:attr="data-filter-label=#{screen.account.list.filter},data-more-label=#{screen.account.list.more},data-count-label=#{screen.account.list.count}">
                <div th:each="attribute : ${authentication.attributes}">
                    <dt th:text="${attribute.key}">authenticationDate</dt>
                    <dd th:text="${#strings.abbreviate(attribute.value, 80)}" th:title="${attribute.value}">[2026-10-02T21:14:06Z]</dd>
                </div>
            </dl>
        </section>
    </div>
</section>
</body>
</html>
