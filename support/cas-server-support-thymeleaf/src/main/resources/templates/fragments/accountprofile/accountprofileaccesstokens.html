<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<section th:fragment="accesstokens" th:if="${oidcAccessTokens}" id="divOidcAccessTokens" class="profile-content" hidden
         aria-labelledby="divOidcAccessTokensTitle"
         th:data-account-trail="|#{screen.account.trail.root} › #{screen.account.group.access} › #{screen.account.accesstokens.title}|">
    <header>
        <div>
            <h2 id="divOidcAccessTokensTitle" th:utext="#{screen.account.accesstokens.title}">Access Tokens</h2>
            <p th:utext="#{screen.account.accesstokens.subtitle}">Access tokens are listed here</p>
        </div>
    </header>
    <ul id="oidcAccessTokensList" class="cas-account-list" data-account-list
        th:unless="${#lists.isEmpty(oidcAccessTokens)}"
        th:attr="data-filter-label=#{screen.account.list.filter},data-more-label=#{screen.account.list.more},data-count-label=#{screen.account.list.count}">
        <li class="cas-account-item" th:each="entry, iter : ${oidcAccessTokens}">
            <div class="cas-account-item-row">
                <span class="cas-account-item-icon" aria-hidden="true">
                    <i class="mdi" th:classappend="${entry.refreshToken} ? 'mdi-refresh' : 'mdi-key-outline'"></i>
                </span>
                <div class="cas-account-item-body">
                    <div class="cas-account-item-title">
                        <span class="acct-mono" th:id="${'accessTokenTitle' + iter.index}" th:text="${entry.id}" th:title="${entry.id}">AT-1-...</span>
                        <span class="cas-account-tag" th:text="${#strings.setJoin(entry.scopes, ', ')}">openid, profile</span>
                        <span class="cas-account-tag is-info" th:if="${entry.refreshToken}"
                              th:text="#{screen.account.accesstokens.refresh}">Refresh token</span>
                    </div>
                    <div class="cas-account-item-meta">
                        <th:block th:if="${entry.service != null}">
                            <span th:text="${entry.service.id}" th:title="${entry.service}">https://app.example.org</span> ·
                        </th:block>
                        <span th:text="#{screen.account.accesstokens.client(${entry.clientId})}">Client client</span>
                        <th:block th:if="${entry.refreshToken}">
                            · <span th:text="#{screen.account.accesstokens.issued(${entry.accessTokenCount})}">2 access tokens issued</span>
                        </th:block>
                    </div>
                </div>
                <div class="cas-account-item-actions">
                    <form method="post" th:action="@{'/account#divOidcAccessTokens'}">
                        <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
                        <input type="hidden" name="id" th:value="${entry.id}" />
                        <input type="hidden" name="clientId" th:value="${entry.clientId}" />
                        <input type="hidden" name="_eventId" value="revokeAccessToken" />
                        <button type="submit" class="acct-btn acct-btn-text acct-btn-danger"
                                th:attr="aria-describedby=${'accessTokenTitle' + iter.index}"
                                th:text="#{screen.account.accesstokens.revoke}">Revoke</button>
                    </form>
                </div>
            </div>
        </li>
    </ul>
</section>
</body>
</html>
