<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<section th:fragment="securityquestions" th:if="${securityQuestionsEnabled}" id="divSecurityQuestions" class="profile-content" hidden
         aria-labelledby="divSecurityQuestionsTitle"
         th:data-account-trail="|#{screen.account.trail.root} › #{screen.account.group.security} › #{screen.account.nav.questions}|">
    <header>
        <div>
            <h2 id="divSecurityQuestionsTitle" th:utext="#{screen.account.securityquestions.title}">Security Questions</h2>
            <p th:utext="#{screen.account.securityquestions.subtitle}">You can review and update your security questions here.</p>
        </div>
    </header>

    <template id="securityQuestionTemplate">
        <fieldset class="cas-account-question" th:fragment="questionRow(question, answer, number)">
            <legend class="visually-hidden" data-question-number
                    th:attr="data-question-template=#{screen.pm.reset.question('{0}')}"
                    th:text="#{screen.pm.reset.question(${number})}">Question 1</legend>
            <label>
                <span data-question-number th:attr="data-question-template=#{screen.pm.reset.question('{0}')}"
                      th:text="#{screen.pm.reset.question(${number})}">Question 1</span>
                <input class="acct-input" type="text" name="questions" th:value="${question}" autocomplete="off" required/>
            </label>
            <label>
                <span data-question-number th:attr="data-question-template=#{screen.pm.reset.answer('{0}')}"
                      th:text="#{screen.pm.reset.answer(${number})}">Answer 1</span>
                <input class="acct-input" type="text" name="answers" th:value="${answer}" autocomplete="off" required/>
            </label>
            <button type="button" class="acct-btn acct-btn-text acct-btn-danger" data-account-action="remove-question"
                    th:text="#{screen.account.securityquestions.remove}">Remove</button>
        </fieldset>
    </template>

    <form method="post" id="updateQuestionsForm" class="cas-account-card cas-account-questions">
        <div id="securityQuestionsList">
            <th:block th:each="entry, iter : ${questions}">
                <fieldset th:replace="~{fragments/accountprofile/accountprofilesecurityquestions :: questionRow(${entry.key}, ${entry.value}, ${iter.count})}"></fieldset>
            </th:block>
            <th:block th:if="${#maps.isEmpty(questions)}">
                <fieldset th:replace="~{fragments/accountprofile/accountprofilesecurityquestions :: questionRow(null, null, 1)}"></fieldset>
            </th:block>
        </div>
        <input type="hidden" name="execution" th:value="${flowExecutionKey}"/>
        <input type="hidden" name="_eventId" value="updateSecurityQuestions"/>
        <div class="cas-account-actions">
            <button type="button" id="addSecurityQuestion" class="acct-btn" data-account-action="add-question">
                <i class="mdi mdi-plus" aria-hidden="true"></i>
                <span th:text="#{screen.account.securityquestions.add}">Add question</span>
            </button>
            <button type="submit" id="saveSecurityQuestions" class="acct-btn acct-btn-primary"
                    th:text="#{screen.account.securityquestions.save}">Save questions</button>
        </div>
    </form>
</section>
</body>
</html>
