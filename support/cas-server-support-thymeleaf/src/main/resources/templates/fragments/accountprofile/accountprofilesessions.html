<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<section th:fragment="sessions" id="divSessions" class="profile-content" hidden aria-labelledby="divSessionsTitle"
         th:data-account-trail="|#{screen.account.trail.root} › #{screen.account.group.access} › #{screen.account.sessions.title}|">
    <header>
        <div>
            <h2 id="divSessionsTitle" th:text="#{screen.account.sessions.title}">SSO sessions</h2>
            <p th:utext="#{screen.account.sessions}">Review your active single sign-on sessions.</p>
        </div>
    </header>
    <ul id="sessionsList" class="cas-account-list" data-account-list
        th:unless="${#lists.isEmpty(singleSignOnSessions)}"
        th:attr="data-filter-label=#{screen.account.list.filter},data-more-label=#{screen.account.list.more},data-count-label=#{screen.account.list.count}">
        <li class="cas-account-item" th:each="entry, iter : ${singleSignOnSessions}">
            <div class="cas-account-item-row">
                <span class="cas-account-item-icon" aria-hidden="true"><i class="mdi mdi-monitor"></i></span>
                <div class="cas-account-item-body">
                    <div class="cas-account-item-title">
                        <span th:id="${'sessionTitle' + iter.index}" th:data-account-useragent="${entry.userAgent}"
                              th:text="${#strings.abbreviate(entry.userAgent, 60)}" th:title="${entry.userAgent}">Chrome · macOS</span>
                    </div>
                    <div class="cas-account-item-meta">
                        <span data-field="principal" th:text="${entry.principal}">casuser</span>
                        · <span data-field="ip" th:text="${entry.clientIpAddress}">192.0.2.14</span>
                        <th:block th:if="${entry.geoLocation != null}">· <span data-field="location" th:text="${#strings.abbreviate(entry.geoLocation, 40)}">Los Angeles</span></th:block>
                        · <span data-field="date" th:text="${entry.authenticationDate}">2026-10-02T21:14:06Z</span>
                    </div>
                </div>
                <div class="cas-account-item-actions">
                    <button type="button" name="viewSessionDetails" class="acct-btn acct-btn-text" th:if="${entry.payload}"
                            data-account-toggle aria-expanded="false"
                            th:attr="aria-controls=${'sessionDetails' + iter.index},aria-describedby=${'sessionTitle' + iter.index},data-label-show=#{screen.account.item.details},data-label-hide=#{screen.account.item.hide}"
                            th:text="#{screen.account.item.details}">Details</button>
                    <form method="post" th:action="@{/account}">
                        <input type="hidden" name="execution" th:value="${flowExecutionKey}" />
                        <input type="hidden" name="id" th:value="${entry.id}" />
                        <input type="hidden" name="_eventId" value="deleteSession" />
                        <button type="submit" name="deleteSession" class="acct-btn acct-btn-text acct-btn-danger"
                                th:attr="aria-describedby=${'sessionTitle' + iter.index}"
                                th:text="#{screen.account.sessions.end}">End session</button>
                    </form>
                </div>
            </div>
            <div class="cas-account-item-details" th:if="${entry.payload}" th:id="${'sessionDetails' + iter.index}" hidden>
                <pre data-account-json th:text="${entry.payload}">{}</pre>
            </div>
        </li>
    </ul>
    <p class="cas-account-empty" th:if="${#lists.isEmpty(singleSignOnSessions)}"
       th:text="#{screen.account.sessions.empty}">No single sign-on sessions to display.</p>
</section>
</body>
</html>
