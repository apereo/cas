<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Profile</title>
    <link href="../../static/css/account.css" rel="stylesheet" th:remove="tag"/>
</head>
<body>
<section th:fragment="applications" th:if="${authorizedServices}" id="divApplications" class="profile-content" hidden
         aria-labelledby="divApplicationsTitle"
         th:data-account-trail="|#{screen.account.trail.root} › #{screen.account.group.access} › #{screen.account.applications.title}|">
    <header>
        <div>
            <h2 id="divApplicationsTitle" th:text="#{screen.account.applications.title}">Applications</h2>
            <p th:utext="#{screen.account.applications}">Applications you are authorized to access.</p>
        </div>
    </header>
    <ul id="applicationsList" class="cas-account-list" data-account-list
        th:unless="${#lists.isEmpty(authorizedServices)}"
        th:attr="data-filter-label=#{screen.account.list.filter},data-more-label=#{screen.account.list.more},data-count-label=#{screen.account.list.count}">
        <li class="cas-account-item" th:each="service : ${authorizedServices}">
            <div class="cas-account-item-row">
                <span class="cas-account-item-icon" aria-hidden="true"><i class="mdi mdi-apps"></i></span>
                <div class="cas-account-item-body">
                    <div class="cas-account-item-title">
                        <a th:id="${'service' + service.id}" th:data-account-service-url="${service.serviceId}"
                           th:text="${service.name}">Application</a>
                    </div>
                    <div class="cas-account-item-meta" th:text="${service.description}">Description</div>
                </div>
                <div class="cas-account-item-actions">
                    <a class="acct-btn acct-btn-text" target="_blank" rel="noopener noreferrer"
                       th:if="${service.informationUrl}" th:href="${service.informationUrl}"
                       th:text="#{screen.account.applications.information}">Information</a>
                    <a class="acct-btn acct-btn-text" target="_blank" rel="noopener noreferrer"
                       th:if="${service.privacyUrl}" th:href="${service.privacyUrl}"
                       th:text="#{screen.account.applications.privacy}">Privacy</a>
                </div>
            </div>
        </li>
    </ul>
    <p class="cas-account-empty" th:if="${#lists.isEmpty(authorizedServices)}"
       th:text="#{screen.account.applications.empty}">No applications to display.</p>
</section>
</body>
</html>
