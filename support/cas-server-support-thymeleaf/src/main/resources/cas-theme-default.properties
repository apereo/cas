# Default theme name
# cas.theme.name=CAS

# Path to theme CSS file; `/themes/[theme_name]/css/cas.css`.
# Multiple files may be comma-separated.
cas.standard.css.file=/css/cas.css,/css/custom.css

# Path to theme JavaScript file; `/themes/[theme_name]/js/js/css`
# Multiple files may be comma-separated.
cas.standard.js.file=/js/cas.js,/js/material.js,/js/custom.js

# Whether to show the CAS logo
cas.logo.enabled=true

# Path to theme logo to display via the common layout.
# Example: `/images/logo.png`
# cas.logo.file=

# Decide whether drawer menu should be displayed.
cas.drawer-menu.enabled=true

# Whether password management/reset links should be displayed.
cas.pm-links.enabled=true

# When password management is turned off, the address of an external
# page where users can recover their password. A link to it is shown
# with the other password management links; nothing is shown when blank.
# cas.pm-links.forgot-password.url=

# When the CAS login form should be displayed.
cas.login-form.enabled=true

# Display a legend on the login form
# to indicate the purpose of the form and fields.
cas.login-form.legend.enabled=true

# Whether the password field on the login form offers
# a button to show and hide the password as it is typed.
cas.login-form.password-reveal.enabled=true

# Whether the login form warns that Caps Lock is on
# while the password is typed.
cas.login-form.caps-lock-warning.enabled=true

# Whether the terms of use should be displayed
# on the login form, and whether the user
# should be required to accept the terms of use.
cas.login-form.terms-of-use.enabled=true

# Whether device fingerprinting
# features should be enabled, allowing
# CAS to catch and record device fingerprints
# for each authentication attempt.
cas.login-form.device-fingerprint.enabled=true

# Whether CAS should remember the username
# entered on the login form for future use.
# Only relevant when public workstation
# features are disabled.
cas.login-form.remember-username.enabled=false

# Enable and display the notifications menu.
cas.notifications-menu.enabled=true

# Enable and display the theme builder next to the notifications menu.
# The theme builder lets you adjust theme properties and styles
# on the page, preview the changes live and download them as a
# theme properties file and a custom.css file for your deployment.
# Changes stay in the browser and are never saved on the server;
# turn this off for production deployments.
cas.theme-builder.enabled=true

# Path to the theme favicon
# Example: `/themes/example/images/favicon.ico`
# cas.favicon.file=

# The description for this theme to describe its purpose
cas.theme.description=Central Authentication Service

# Where the main content of each page sits on the screen, seen as a
# 3x3 grid: topleft, topcenter, topright, middleleft, middlecenter,
# middleright, bottomleft, bottomcenter or bottomright.
cas.main-content.position=topcenter

# Path to a "hero" styled image/logo
# that would be displayed on the login form.
# cas.hero-banner.file=

# Whether core/default JavaScript libraries
# should be included in the theme.
cas.js.core.enabled=true

# Whether the theme should attempt to
# include CAS-provided CSS core libraries
cas.css.core.enabled=true

# Whether the theme should display a language selection menu
cas.locale-selection.enabled=true

# When language selection menu is enabled,
# control the allowed languages that can be displayed
# and selected in the menu
cas.locale-selection.languages=en,de,fr,it,es,ar,fa,ja,nl,pl,ru,sk,tr,pt_BR,zh_CN,zh_TW

# Whether principal/authentication attributes
# and other application data should be displayed on the screen
# after a successful "generic" authentication event.
cas.successful-login.display-attributes=true

# Whether user should be given the option to
# indicate if the current device is a public workstation
cas.public-workstation.enabled=false

# Whether use should be given the option to
# receive a warning prior to redirects to
# external sites and domains
cas.warn-on-redirect.enabled=false

# Name of fragments that would be found
# inside `fragments/custom.html`.
# Such fragments would be included in the
# global layout inside the head tag of each affected page
# cas.standard.fragments.head=

# While reading or writing data to browser storage,
# control whether CAS should show its user interface, progress bar, etc.
cas.browser-storage.show-progress=true

# Whether the footer should be displayed
cas.footer.show=true

# When footer is displayed, control
# whether the CAS version should be shown and listed.
cas.footer.show-version=true

# When footer is displayed, control
# whether the CAS server host should be shown and listed.
cas.footer.show-host=true

# When footer is displayed, control
# whether the client IP address should be shown and listed.
cas.footer.show-client-ip=true

# Control whether CAS should display
# information about the current application
# requesting authentication.
cas.service-ui.show=true

# Control whether CAS should display
# additional details about the application
# requesting authentication such information urls,
# privacy URLs, description, etc.
cas.service-ui.show-details=true

# When enabled, CAS will display a side panel
# to the left of the login form that is primarily used
# to show customizations or additional information
# about the service.
cas.login-side-panel.enabled=false

# Where the login side panel sits next to the login form,
# when the side panel is enabled: start or end.
cas.login-side-panel.position=start

# Where external identity providers are listed relative
# to the login form: after or before.
cas.login-providers.position=after

# How external identity provider buttons are arranged:
# stacked (one per row), grid (two columns) or inline
# (buttons side by side, wrapping as needed).
cas.login-providers.layout=stacked

# Once more external identity providers than this are available,
# they are offered in a dropdown instead of as buttons.
cas.login-providers.select-threshold=10

# Whether external identity providers are sorted by name.
# When false, they are listed in the order CAS configures them.
cas.login-providers.sort=false

# Whether error pages show the message of the error.
cas.error.show-message=true

# Whether error pages offer a button to view error details,
# such as a stack trace, when the server includes them.
cas.error.show-details=false

# Whether WebAuthn shows the details of the authenticated device
# (username, nickname, registration date and device) once
# authentication succeeds.
cas.webauthn.authentication.show-device-details=true

# The registration option that WebAuthn presents as recommended:
# passkey, security-key or none.
cas.webauthn.registration.recommended=passkey

# Whether Google Authenticator registration shows the secret key
# that can be typed into the app instead of scanning the QR code.
cas.gauth.registration.show-secret-key=true

# How Google Authenticator registration shows scratch codes:
# chips or list.
cas.gauth.registration.scratch-codes=chips

# Whether Google Authenticator registration offers a print button.
cas.gauth.registration.show-print=true

# Size of generated QR codes in pixels, used by Google Authenticator,
# WebAuthn and QR code login.
cas.qr-code.size=250

# Color of the modules of generated QR codes, as #rrggbb.
# It must be darker than the background color.
cas.qr-code.foreground=#000000

# Background color of generated QR codes, as #rrggbb.
cas.qr-code.background=#FFFFFF

# Width of the quiet zone around generated QR codes, in modules.
cas.qr-code.margin=2

# How the multifactor authentication provider selection
# lists providers: list, grid or cards.
cas.mfa.selection.layout=list

# How device and account names are suggested when registering
# a multifactor authentication device (trusted devices, Google
# Authenticator, YubiKey, WebAuthn): random, empty or username.
cas.mfa.device-name.prefill=random

# Whether attribute consent shows the values of the attributes
# that are released, or only their names.
cas.consent.show-attribute-values=true

# How attribute consent lists the released attributes: table or list.
cas.consent.layout=table
